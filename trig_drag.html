<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼각비 드래그 퍼즐</title>
    <link rel="stylesheet" href="style.css?v=2"> 
    <link rel="stylesheet" href="trig.css?v=2">
    
    <!-- 🌟 입장 검사소 (비밀번호 코드) 🌟 -->
    <script>
        // 드래그 퍼즐 프리패스 도장 확인!
        if (!sessionStorage.getItem("dragPass")) {
            const pwd = prompt("드래그 퍼즐 게임입니다. 비밀번호를 입력하세요 🔒");
            if (pwd === "1234") {
                sessionStorage.setItem("dragPass", "true");
            } else {
                alert("비밀번호가 틀렸습니다! 메인 화면으로 돌아갑니다. ❌");
                location.href = "index.html"; 
            }
        }
    </script>
    <!-- 여기까지 -->
    
</head>
<body>
    <div class="game-container">
        <div class="header">
            <a href="index.html" class="back-btn">⬅ 메인으로</a>
            <h2>📐 삼각비 드래그 퍼즐</h2>
        </div>
        
        <div class="triangle-diagram">
            <img src="triangle_diagram.png" alt="직각삼각형 정의"> 
        </div>

        <p class="instruction">블록을 끌어서 빈칸에 쏙 집어넣으세요!</p>

        <div class="question-area">
            <h1 id="question-title">sin</h1>
        </div>

        <div class="fraction-builder">
            <div class="slot" id="slot-top" ondrop="drop(event)" ondragover="allowDrop(event)">분자 (?)</div>
            <div class="fraction-line"></div>
            <div class="slot" id="slot-bottom" ondrop="drop(event)" ondragover="allowDrop(event)">분모 (?)</div>
        </div>

        <div class="block-area">
            <div class="word-block" id="block-ab" draggable="true" ondragstart="drag(event)">선분 AB</div>
            <div class="word-block" id="block-bc" draggable="true" ondragstart="drag(event)">선분 BC</div>
            <div class="word-block" id="block-ac" draggable="true" ondragstart="drag(event)">선분 AC</div>
        </div>

        <button class="reset-btn" onclick="resetSlots()">비우기 🔄</button>

        <div id="message" class="message"></div>
    </div>

    <script src="trig.js"></script>
</body>
</html>
