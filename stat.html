<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>통계 몬스터 디펜스</title>
<script>
    // 🔒 비밀번호 검증 시스템
    if (!sessionStorage.getItem("statUnlocked")) {
        const pwd = prompt("통계 몬스터 디펜스 비밀번호를 입력하세요 🔒");
        if (pwd === "7590_@") {
            sessionStorage.setItem("statUnlocked", "true");
            alert("보안 해제 완료! 포격전 준비! 🚀");
        } else {
            alert("비밀번호가 틀렸습니다! ❌");
            location.href = "index.html";
        }
    }
</script>
<style>
    body { font-family: 'Malgun Gothic', sans-serif; background-color: #2c3e50; color: white; text-align: center; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: #34495e; padding: 20px; border-radius: 15px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); position: relative; }
    h1 { color: #f1c40f; margin-top: 0; font-size: 26px; }
    
    #gameArea { position: relative; width: 600px; height: 500px; margin: 0 auto; background: #ecf0f1; border-radius: 10px; overflow: hidden; border: 4px solid #bdc3c7; }
    canvas { position: absolute; top: 0; left: 0; }
    
    /* 스테이지 1 컨트롤 UI */
    #stage1UI { position: absolute; bottom: -70px; left: 50%; transform: translateX(-50%); display: none; width: 100%; justify-content: center; gap: 10px; }
    #answerInput { font-size: 24px; padding: 10px; width: 180px; border-radius: 8px; border: none; text-align: center; font-weight: bold; }
    #fireActionBtn { font-size: 22px; padding: 10px 25px; border-radius: 8px; border: none; background: #e74c3c; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px #c0392b; }
    #fireActionBtn:active { transform: translateY(4px); box-shadow: 0 0 #c0392b; }

    .hud { position: absolute; top: 10px; font-weight: bold; font-size: 20px; color: #2c3e50; z-index: 10; }
    #timerDisplay { left: 20px; }
    #stageInfo { right: 20px; }
    .legend { position: absolute; top: 40px; right: 20px; font-size: 14px; text-align: left; color: #333; background: rgba(255,255,255,0.8); padding: 5px; border-radius: 5px; }

    /* 스테이지 2 UI */
    #stage2UI { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #2c3e50; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; color: white; }
    .magazine-container { display: flex; gap: 10px; margin: 20px 0; }
    .magazine-input { font-size: 20px; width: 60px; height: 60px; text-align: center; border-radius: 8px; border: 2px solid #bdc3c7; background: #34495e; color: #f1c40f; font-weight: bold; }
    
    #statsDisplay { margin-bottom: 20px; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; width: 80%; }
    #stdDevBarContainer { width: 100%; height: 20px; background: #bdc3c7; border-radius: 10px; margin-top: 10px; overflow: hidden; }
    #stdDevBar { height: 100%; width: 0%; background: #2ecc71; transition: 0.3s; }
    
    #fireBtn { font-size: 24px; padding: 15px 40px; background: #e74c3c; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; opacity: 0.5; pointer-events: none; }
    #fireBtn.active { opacity: 1; pointer-events: auto; background: #c0392b; }
    
    .screen-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 50; }
    .btn { padding: 15px 30px; font-size: 20px; margin: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; background: #27ae60; }
    .back-btn { display: inline-block; margin-top: 40px; padding: 10px 20px; background: #7f8fa6; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; }
</style>
</head>
<body>
    <div class="container">
        <h1>⚔️ 통계 몬스터 디펜스 ⚔️</h1>
        
        <div id="gameArea">
            <canvas id="gameCanvas" width="600" height="500"></canvas>
            
            <div id="timerDisplay" class="hud" style="display:none;">남은 시간: 60초</div>
            <div id="stageInfo" class="hud" style="display:none;">Stage 1: 몬스터 요격</div>
            <div id="legendBox" class="legend" style="display:none;">
                <span style="color:#c0392b; font-weight:bold;">■ 빨강: 평균</span><br>
                <span style="color:#2980b9; font-weight:bold;">■ 파랑: 중앙값</span><br>
                <span style="color:#f39c12; font-weight:bold;">■ 노랑: 최빈값</span>
            </div>

            <div id="menuScreen" class="screen-overlay">
                <h2 style="color: #f1c40f;">최후의 포격전</h2>
                <p>수학 지식으로 대포를 발사해 성벽을 지키세요!<br>한 마리라도 성벽에 닿으면 즉시 파괴됩니다.</p>
                <button class="btn" onclick="startStage1()">게임 시작</button>
            </div>

            <!-- 스테이지 2 (보스전) -->
            <div id="stage2UI">
                <h2 style="color:#e74c3c; margin:0;">거대 보스 등장! (Lv 1)</h2>
                <h3 id="bossHpText">보스 HP: 50 / 남은 턴: 4</h3>
                <p>100의 데미지를 6개의 탄창에 분배하세요!</p>
                
                <div class="magazine-container" id="magazines"></div>

                <div id="statsDisplay">
                    총 분배량: <span id="totalDmg" style="color:#e74c3c;">0</span> / 100<br>
                    산포도(표준편차): <span id="stdDevText">0.0</span> <strong id="riskText" style="color:#2ecc71;">(안정적)</strong>
                    <div id="stdDevBarContainer"><div id="stdDevBar"></div></div>
                </div>

                <button id="fireBtn" onclick="fireRoulette()">발사! (Fire)</button>
            </div>
        </div>
        
        <!-- 대포 발사 컨트롤 UI -->
        <div id="stage1UI">
            <input type="number" id="answerInput" placeholder="정답 입력" autocomplete="off">
            <button id="fireActionBtn" onclick="fireCannon()">발사!</button>
        </div>
        
        <a href="index.html" class="back-btn">⬅ 로비로 돌아가기</a>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    
    // 게임 상태 변수
    let state = "MENU"; 
    let stage1Timer = 60;
    let spawnTimer = 0;
    
    let monsters = [];
    let projectiles = []; // 대포알 배열
    let explosions = [];  // 폭발 이펙트 배열
    
    let intervalId;
    let animId;
    
    // 초기 설정: 자료 개수 3개
    let dataCount = 3; 
    let bossHp = 50;
    let bossTurns = 4;
    
    function generateData(type, count) {
        let arr = [];
        let targetAnswer = 0;
        
        if (type === 'mean') {
            let sum = 0;
            for (let i = 0; i < count - 1; i++) {
                let n = Math.floor(Math.random() * 9) + 1;
                arr.push(n);
                sum += n;
            }
            let remainder = sum % count;
            let needed = (count - remainder) % count;
            if (needed === 0) needed = count;
            arr.push(needed);
            targetAnswer = (sum + needed) / count;
        } 
        else if (type === 'median') { 
            for (let i = 0; i < count; i++) {
                arr.push(Math.floor(Math.random() * 19) + 1);
            }
            let sorted = [...arr].sort((a,b)=>a-b);
            targetAnswer = sorted[Math.floor(count/2)];
        } 
        else if (type === 'mode') { 
            let modeVal = Math.floor(Math.random() * 9) + 1;
            arr.push(modeVal, modeVal); 
            while (arr.length < count) {
                let n = Math.floor(Math.random() * 15) + 1;
                if (n !== modeVal && !arr.includes(n)) {
                    arr.push(n);
                }
            }
            arr.sort(() => Math.random() - 0.5); 
            targetAnswer = modeVal;
        }
        return { data: arr, answer: targetAnswer };
    }

    window.startStage1 = function() {
        document.getElementById("menuScreen").style.display = "none";
        document.getElementById("stage1UI").style.display = "flex";
        document.getElementById("timerDisplay").style.display = "block";
        document.getElementById("stageInfo").style.display = "block";
        document.getElementById("legendBox").style.display = "block";
        document.getElementById("answerInput").focus();
        
        state = "STAGE1";
        stage1Timer = 60;
        monsters = [];
        projectiles = [];
        explosions = [];
        spawnTimer = 0;
        
        clearInterval(intervalId);
        intervalId = setInterval(() => {
            if(state === "STAGE1") {
                stage1Timer--;
                document.getElementById("timerDisplay").innerText = `남은 시간: ${stage1Timer}초`;
                if(stage1Timer <= 0) {
                    transitionToStage2();
                }
            }
        }, 1000);
        
        requestAnimationFrame(gameLoop);
    };

    function spawnMonster() {
        const types = [
            { type: 'mean', color: '#e74c3c', label: '평균' },
            { type: 'median', color: '#3498db', label: '중앙' },
            { type: 'mode', color: '#f1c40f', label: '최빈' }
        ];
        const selected = types[Math.floor(Math.random() * types.length)];
        const count = selected.type === 'median' ? (dataCount % 2 === 0 ? dataCount + 1 : dataCount) : dataCount;
        
        const q = generateData(selected.type, count);
        
        monsters.push({
            id: Math.random().toString(36).substr(2, 9),
            x: 50 + Math.random() * (canvas.width - 100),
            y: -50,
            color: selected.color,
            dataStr: q.data.join(', '),
            answer: q.answer,
            // 초기 속도 절반으로 감소 (0.25 ~ 0.5)
            speed: (0.5 + Math.random() * 0.5) / 2,
            targeted: false
        });
    }

    // 엔터키 입력 시 발사
    document.getElementById("answerInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter" && state === "STAGE1") {
            fireCannon();
        }
    });

    // 대포 발사 로직
    window.fireCannon = function() {
        const inputEl = document.getElementById("answerInput");
        const val = parseInt(inputEl.value);
        inputEl.value = '';
        inputEl.focus();
        
        if (isNaN(val)) return;

        let target = null;
        let maxY = -999;
        
        // 정답이 일치하고, 아직 다른 대포알의 타겟이 되지 않은 몬스터 중 가장 아래에 있는 놈 탐색
        for(let i=0; i<monsters.length; i++) {
            if(monsters[i].answer === val && !monsters[i].targeted && monsters[i].y > maxY) {
                maxY = monsters[i].y;
                target = monsters[i];
            }
        }
        
        if(target) {
            target.targeted = true;
            // 대포 위치(300, 430)에서 대포알 생성
            projectiles.push({
                x: canvas.width / 2,
                y: 430,
                targetId: target.id,
                speed: 12
            });
        }
    }

    function gameLoop() {
        if (state === "STAGE1") {
            updateStage1();
            drawStage1();
            animId = requestAnimationFrame(gameLoop);
        }
    }

    function updateStage1() {
        spawnTimer++;
        // 몬스터 등장 주기 2배로 늦춤 (기존 120 -> 240)
        if (spawnTimer > 240) { 
            spawnMonster();
            spawnTimer = 0;
        }

        // 몬스터 이동
        for (let i = 0; i < monsters.length; i++) {
            monsters[i].y += monsters[i].speed;
            if (monsters[i].y > 430) { 
                gameOver();
                return;
            }
        }

        // 대포알 이동 및 충돌 판정
        for (let i = projectiles.length - 1; i >= 0; i--) {
            let p = projectiles[i];
            let target = monsters.find(m => m.id === p.targetId);
            
            if (!target) {
                projectiles.splice(i, 1);
                continue;
            }

            let dx = target.x - p.x;
            let dy = target.y - p.y;
            let dist = Math.hypot(dx, dy);

            // 명중
            if (dist < p.speed + 15) {
                explosions.push({ x: target.x, y: target.y, radius: 5, maxRadius: 40, alpha: 1 });
                monsters = monsters.filter(m => m.id !== p.targetId);
                projectiles.splice(i, 1);
            } else {
                p.x += (dx / dist) * p.speed;
                p.y += (dy / dist) * p.speed;
            }
        }

        // 폭발 이펙트 업데이트
        for (let i = explosions.length - 1; i >= 0; i--) {
            let e = explosions[i];
            e.radius += 2;
            e.alpha -= 0.05;
            if (e.alpha <= 0) explosions.splice(i, 1);
        }
    }

    function drawStage1() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 1. 성벽 그리기 (벽돌 패턴)
        ctx.fillStyle = "#7f8c8d";
        ctx.fillRect(0, 450, canvas.width, 50);
        
        ctx.strokeStyle = "#2c3e50";
        ctx.lineWidth = 2;
        for(let x = 0; x < canvas.width; x += 60) {
            for(let y = 450; y < 500; y += 15) {
                let offsetX = (y % 30 === 0) ? 30 : 0;
                ctx.strokeRect(x - offsetX, y, 60, 15);
            }
        }
        ctx.fillStyle = "#ecf0f1";
        ctx.font = "bold 18px Arial";
        ctx.textAlign = "center";
        ctx.fillText("방어 성벽", canvas.width/2, 490);

        // 2. 대포 그리기 (중앙 하단)
        ctx.fillStyle = "#34495e";
        ctx.beginPath();
        ctx.arc(canvas.width / 2, 450, 25, Math.PI, 0); // 대포 베이스
        ctx.fill();
        ctx.fillStyle = "#2c3e50";
        ctx.fillRect(canvas.width / 2 - 10, 410, 20, 40); // 대포 포신

        // 3. 몬스터 그리기
        ctx.textAlign = "center";
        for (let m of monsters) {
            ctx.fillStyle = m.color;
            ctx.beginPath();
            ctx.arc(m.x, m.y, 25, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#2c3e50";
            ctx.stroke();

            // 몬스터 눈
            ctx.fillStyle = "#fff";
            ctx.fillRect(m.x - 10, m.y - 10, 6, 6);
            ctx.fillRect(m.x + 4, m.y - 10, 6, 6);
            
            // 문제 텍스트
            ctx.fillStyle = "#2c3e50";
            ctx.font = "bold 16px Arial";
            ctx.fillText(m.dataStr, m.x, m.y - 35);
        }

        // 4. 날아가는 대포알 그리기
        ctx.fillStyle = "#e67e22";
        for (let p of projectiles) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#d35400";
            ctx.stroke();
        }

        // 5. 폭발 이펙트 그리기
        for (let e of explosions) {
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(231, 76, 60, ${e.alpha})`;
            ctx.fill();
        }
    }

    function gameOver() {
        state = "GAMEOVER";
        clearInterval(intervalId);
        document.getElementById("stage1UI").style.display = "none";
        document.getElementById("menuScreen").style.display = "flex";
        document.getElementById("menuScreen").innerHTML = `
            <h2 style="color: #e74c3c;">성벽 파괴!</h2>
            <p>몬스터가 성벽에 닿았습니다.</p>
            <button class="btn" onclick="location.reload()">다시 도전</button>
        `;
    }

    function transitionToStage2() {
        state = "STAGE2_INPUT";
        clearInterval(intervalId);
        cancelAnimationFrame(animId);
        
        document.getElementById("timerDisplay").style.display = "none";
        document.getElementById("stageInfo").style.display = "none";
        document.getElementById("legendBox").style.display = "none";
        document.getElementById("stage1UI").style.display = "none";
        
        document.getElementById("stage2UI").style.display = "flex";
        initMagazines();
        updateBossUI();
    }

    // --- 스테이지 2 (이전 코드와 동일 유지) ---
    const magContainer = document.getElementById("magazines");
    let magInputs = [];

    function initMagazines() {
        magContainer.innerHTML = '';
        magInputs = [];
        for (let i = 0; i < 6; i++) {
            let input = document.createElement("input");
            input.type = "number";
            input.className = "magazine-input";
            input.value = (i === 5) ? 15 : 17; 
            input.min = 0;
            input.max = 100;
            input.addEventListener("input", calculateStats);
            magContainer.appendChild(input);
            magInputs.push(input);
        }
        calculateStats();
    }

    function calculateStats() {
        let sum = 0;
        let values = [];
        magInputs.forEach(inp => {
            let val = parseInt(inp.value) || 0;
            sum += val;
            values.push(val);
        });
        
        const totalSpan = document.getElementById("totalDmg");
        const fireBtn = document.getElementById("fireBtn");
        totalSpan.innerText = sum;
        
        if (sum === 100) {
            totalSpan.style.color = "#2ecc71";
            fireBtn.classList.add("active");
        } else {
            totalSpan.style.color = "#e74c3c";
            fireBtn.classList.remove("active");
        }

        let mean = sum / 6;
        let variance = values.reduce((acc, val) => acc + Math.pow(val - mean, 2), 0) / 6;
        let stdDev = Math.sqrt(variance);
        
        document.getElementById("stdDevText").innerText = stdDev.toFixed(1);
        
        let riskPercent = Math.min((stdDev / 37.3) * 100, 100);
        let bar = document.getElementById("stdDevBar");
        let riskText = document.getElementById("riskText");
        
        bar.style.width = riskPercent + "%";
        
        if (riskPercent < 15) {
            bar.style.background = "#2ecc71";
            riskText.innerText = "(매우 안정적)";
            riskText.style.color = "#2ecc71";
        } else if (riskPercent < 60) {
            bar.style.background = "#f1c40f";
            riskText.innerText = "(도박성 증가)";
            riskText.style.color = "#f1c40f";
        } else {
            bar.style.background = "#e74c3c";
            riskText.innerText = "(하이 리스크!)";
            riskText.style.color = "#e74c3c";
        }
    }

    window.fireRoulette = function() {
        let sum = 0;
        let values = [];
        magInputs.forEach(inp => {
            let val = parseInt(inp.value) || 0;
            sum += val;
            values.push(val);
        });
        if (sum !== 100) return;

        let firedIndex = Math.floor(Math.random() * 6);
        let damage = values[firedIndex];

        document.getElementById("stage2UI").innerHTML = `
            <h2 style="font-size: 40px; color: #f1c40f;">룰렛 발사!</h2>
            <h1 style="font-size: 80px; margin: 20px;">💥 ${damage} 데미지! 💥</h1>
        `;

        setTimeout(() => {
            bossHp -= damage;
            bossTurns--;
            
            if (bossHp <= 0) {
                document.getElementById("stage2UI").innerHTML = `
                    <h1 style="color: #2ecc71; font-size: 50px;">보스 격파 성공! 🎉</h1>
                    <p style="font-size: 20px;">수학의 힘으로 성벽을 지켜냈습니다!</p>
                    <button class="btn" onclick="location.href='index.html'">로비로 돌아가기</button>
                `;
            } else if (bossTurns <= 0) {
                document.getElementById("stage2UI").innerHTML = `
                    <h1 style="color: #e74c3c; font-size: 50px;">성벽 파괴... 😭</h1>
                    <p style="font-size: 20px;">보스가 성벽에 도달했습니다.</p>
                    <button class="btn" onclick="location.reload()">재도전</button>
                `;
            } else {
                document.getElementById("stage2UI").innerHTML = `
                    <h2 style="color:#e74c3c; margin:0;">거대 보스 다가오는 중!</h2>
                    <h3 id="bossHpText"></h3>
                    <p>100의 데미지를 6개의 탄창에 다시 분배하세요!</p>
                    <div class="magazine-container" id="magazines"></div>
                    <div id="statsDisplay">
                        총 분배량: <span id="totalDmg" style="color:#e74c3c;">0</span> / 100<br>
                        산포도(표준편차): <span id="stdDevText">0.0</span> <strong id="riskText"></strong>
                        <div id="stdDevBarContainer"><div id="stdDevBar"></div></div>
                    </div>
                    <button id="fireBtn" onclick="fireRoulette()">발사! (Fire)</button>
                `;
                initMagazines();
                updateBossUI();
            }
        }, 2000);
    };

    function updateBossUI() {
        document.getElementById("bossHpText").innerText = `보스 HP: ${bossHp} / 남은 턴: ${bossTurns}`;
    }
</script>
</body>
</html>
