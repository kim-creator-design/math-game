<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대푯값과 통계 마스터</title>
<style>
    body { font-family: 'Malgun Gothic', sans-serif; background-color: #2c3e50; color: white; text-align: center; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: #34495e; padding: 20px; border-radius: 15px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); position: relative; min-height: 550px; }
    h1 { color: #f1c40f; margin-top: 0; font-size: 26px; }
    
    #subLobby { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: 50px; }
    .mode-cards { display: flex; gap: 20px; margin-top: 30px; }
    .mode-card { background: #ecf0f1; color: #2c3e50; padding: 30px; border-radius: 15px; cursor: pointer; transition: 0.3s; width: 250px; box-shadow: 0 6px 12px rgba(0,0,0,0.3); }
    .mode-card:hover { transform: translateY(-10px); box-shadow: 0 12px 24px rgba(0,0,0,0.4); }
    .mode-card h2 { color: #e74c3c; margin-top: 0; }
    .mode-card.roulette h2 { color: #8e44ad; }
    
    #gameArea { position: relative; width: 600px; height: 500px; margin: 0 auto; background: #ecf0f1; border-radius: 10px; overflow: hidden; border: 4px solid #bdc3c7; display: none; }
    canvas { position: absolute; top: 0; left: 0; }
    
    #stage1UI { position: absolute; bottom: -70px; left: 50%; transform: translateX(-50%); display: none; width: 100%; justify-content: center; gap: 10px; }
    #answerInput { font-size: 24px; padding: 10px; width: 180px; border-radius: 8px; border: none; text-align: center; font-weight: bold; }
    #fireActionBtn { font-size: 22px; padding: 10px 25px; border-radius: 8px; border: none; background: #e74c3c; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px #c0392b; }
    #fireActionBtn:active { transform: translateY(4px); box-shadow: 0 0 #c0392b; }

    .hud { position: absolute; top: 10px; font-weight: bold; font-size: 20px; color: #2c3e50; z-index: 10; }
    #timerDisplay { left: 20px; }
    #stageInfo { right: 20px; }
    .legend { position: absolute; top: 40px; right: 20px; font-size: 14px; text-align: left; color: #333; background: rgba(255,255,255,0.8); padding: 8px; border-radius: 5px; }

    /* 러시안 룰렛 UI */
    #stage2UI { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #2c3e50; display: none; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 20px; z-index: 20; color: white; box-sizing: border-box; }
    
    .battle-arena { position: relative; width: 90%; height: 140px; background: #34495e; border: 3px solid #7f8fa6; border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
    .player-sprite { position: absolute; left: 20px; bottom: 10px; font-size: 50px; z-index: 2; transform: scaleX(-1); }
    .boss-sprite { position: absolute; right: 20px; bottom: 10px; font-size: 60px; z-index: 2; transition: right 0.5s ease; }
    .bullet-sprite { position: absolute; left: 60px; bottom: 35px; font-size: 24px; z-index: 1; display: none; }
    
    .hp-container { position: absolute; top: 10px; right: 20px; width: 150px; background: #c0392b; height: 15px; border-radius: 5px; border: 2px solid #ecf0f1; }
    .hp-bar { width: 100%; height: 100%; background: #2ecc71; transition: width 0.3s; }
    .hp-text { position: absolute; top: -20px; right: 0; font-size: 14px; font-weight: bold; }

    .magazine-container { display: flex; gap: 10px; margin: 10px 0; }
    .magazine-input { font-size: 20px; width: 55px; height: 55px; text-align: center; border-radius: 8px; border: 2px solid #bdc3c7; background: #34495e; color: #f1c40f; font-weight: bold; }
    
    #statsDisplay { margin-bottom: 15px; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; width: 80%; font-size: 14px; }
    #stdDevBarContainer { width: 100%; height: 15px; background: #bdc3c7; border-radius: 10px; margin-top: 10px; overflow: hidden; }
    #stdDevBar { height: 100%; width: 0%; background: #2ecc71; transition: 0.3s; }
    
    #fireBtn { font-size: 22px; padding: 10px 40px; background: #e74c3c; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; opacity: 0.5; pointer-events: none; }
    #fireBtn.active { opacity: 1; pointer-events: auto; background: #c0392b; }
    
    .screen-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 50; }
    .btn { padding: 12px 25px; font-size: 18px; margin: 8px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; background: #27ae60; }
    .btn-diff { background: #3498db; }
    .back-btn { display: inline-block; margin-top: 40px; padding: 10px 20px; background: #7f8fa6; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; }
</style>
</head>
<body>
    <div class="container">
        <h1>📊 대푯값과 통계 마스터</h1>
        
        <div id="subLobby">
            <h2>도전할 모드를 선택하세요!</h2>
            <div class="mode-cards">
                <div class="mode-card" onclick="enterGame('monster')">
                    <h2>🧟 진격의 괴물</h2>
                    <p>대푯값 맞추기 방어전</p>
                    <p style="font-size: 12px; color: #7f8c8d;">60초 동안 성벽을 지켜내세요!</p>
                </div>
                <div class="mode-card roulette" onclick="enterGame('roulette')">
                    <h2>🔫 러시안 룰렛</h2>
                    <p>총알 배분 보스전</p>
                    <p style="font-size: 12px; color: #7f8c8d;">산포도를 활용해 보스를 쓰러뜨리세요!</p>
                </div>
            </div>
        </div>

        <div id="gameArea">
            <canvas id="gameCanvas" width="600" height="500"></canvas>
            
            <div id="timerDisplay" class="hud" style="display:none;">남은 시간: 60초</div>
            <div id="stageInfo" class="hud" style="display:none;">진격의 괴물</div>
            <div id="legendBox" class="legend" style="display:none;">
                <strong>👹 평균</strong><br>
                <strong>👽 중앙값</strong><br>
                <strong>👾 최빈값</strong>
            </div>

            <!-- 진격의 괴물 난이도 선택 창 -->
            <div id="menuScreen" class="screen-overlay">
                <h2 style="color: #f1c40f;">진격의 괴물</h2>
                <p>수학 지식으로 대포를 발사해 성벽을 지키세요!</p>
                <div style="display:flex; gap: 10px; margin-top:20px;">
                    <button class="btn btn-diff" onclick="startMonsterGame('easy')">쉬움 (자료 3개, 느림)</button>
                    <button class="btn btn-diff" style="background:#e67e22" onclick="startMonsterGame('normal')">보통 (자료 5개, 느림)</button>
                    <button class="btn btn-diff" style="background:#e74c3c" onclick="startMonsterGame('hard')">어려움 (자료 5개, 빠름)</button>
                </div>
            </div>
            
            <div id="resultScreen" class="screen-overlay"></div>

            <!-- 러시안 룰렛 보스전 -->
            <div id="stage2UI">
                <div class="battle-arena">
                    <div class="player-sprite">🔫</div>
                    <div id="bulletSprite" class="bullet-sprite">💨</div>
                    <div id="bossSprite" class="boss-sprite">🐉</div>
                    <div class="hp-container">
                        <div class="hp-text" id="bossHpTextUi">HP: 50</div>
                        <div id="bossHpBar" class="hp-bar"></div>
                    </div>
                </div>

                <h2 style="color:#e74c3c; margin:5px 0;">거대 몬스터 요격!</h2>
                <p style="margin: 5px 0; font-size:14px;">100의 화력을 6개의 탄창에 분배하세요. (남은 턴: <span id="turnText">4</span>)</p>
                
                <div class="magazine-container" id="magazines"></div>

                <div id="statsDisplay">
                    총 분배량: <span id="totalDmg" style="color:#e74c3c;">0</span> / 100<br>
                    산포도(표준편차): <span id="stdDevText">0.0</span> <strong id="riskText" style="color:#2ecc71;">(안정적)</strong>
                    <div id="stdDevBarContainer"><div id="stdDevBar"></div></div>
                </div>

                <button id="fireBtn" onclick="fireRoulette()">발사! (Fire)</button>
            </div>
        </div>
        
        <div id="stage1UI">
            <input type="number" id="answerInput" placeholder="정답 입력" autocomplete="off">
            <button id="fireActionBtn" onclick="fireCannon()">발사!</button>
        </div>
        
        <button class="back-btn" onclick="goBack()">⬅ 뒤로 가기</button>
    </div>

<script>
    function goBack() {
        if (document.getElementById("subLobby").style.display === "none") location.reload();
        else location.href = "index.html"; 
    }

    function enterGame(mode) {
        if (mode === 'monster') {
            if (!sessionStorage.getItem("monsterUnlocked")) {
                const pwd = prompt("진격의 괴물 비밀번호를 입력하세요 🔒");
                if (pwd === "7590_@") { sessionStorage.setItem("monsterUnlocked", "true"); } 
                else { alert("비밀번호가 틀렸습니다! ❌"); return; }
            }
            document.getElementById("subLobby").style.display = "none";
            document.getElementById("gameArea").style.display = "block";
            document.getElementById("menuScreen").style.display = "flex";
        } else if (mode === 'roulette') {
            if (!sessionStorage.getItem("rouletteUnlocked")) {
                const pwd = prompt("러시안 룰렛 비밀번호를 입력하세요 🔒");
                if (pwd === "8342*#") { sessionStorage.setItem("rouletteUnlocked", "true"); } 
                else { alert("비밀번호가 틀렸습니다! ❌"); return; }
            }
            document.getElementById("subLobby").style.display = "none";
            document.getElementById("gameArea").style.display = "block";
            startRouletteGame();
        }
    }

    // ==========================================
    // 1. 진격의 괴물 (대푯값 방어전)
    // ==========================================
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    
    let state = "MENU"; 
    let stage1Timer = 60, spawnTimer = 0;
    let monsters = [], projectiles = [], explosions = [];
    let intervalId, animId;
    let currentDifficulty = {};
    
    function generateData(type, count) {
        let arr = []; let targetAnswer = 0;
        if (type === 'mean') {
            let sum = 0;
            for (let i = 0; i < count - 1; i++) { let n = Math.floor(Math.random() * 9) + 1; arr.push(n); sum += n; }
            let remainder = sum % count; let needed = (count - remainder) % count;
            if (needed === 0) needed = count;
            arr.push(needed); targetAnswer = (sum + needed) / count;
        } 
        else if (type === 'median') { 
            for (let i = 0; i < count; i++) arr.push(Math.floor(Math.random() * 19) + 1);
            let sorted = [...arr].sort((a,b)=>a-b); targetAnswer = sorted[Math.floor(count/2)];
        } 
        else if (type === 'mode') { 
            let modeVal = Math.floor(Math.random() * 9) + 1; arr.push(modeVal, modeVal); 
            while (arr.length < count) {
                let n = Math.floor(Math.random() * 15) + 1;
                if (n !== modeVal && !arr.includes(n)) arr.push(n);
            }
            arr.sort(() => Math.random() - 0.5); targetAnswer = modeVal;
        }
        return { data: arr, answer: targetAnswer };
    }

    window.startMonsterGame = function(diff) {
        if (diff === 'easy') currentDifficulty = { count: 3, speedMulti: 0.5 };
        else if (diff === 'normal') currentDifficulty = { count: 5, speedMulti: 0.5 };
        else if (diff === 'hard') currentDifficulty = { count: 5, speedMulti: 1.0 };

        document.getElementById("menuScreen").style.display = "none";
        document.getElementById("stage1UI").style.display = "flex";
        document.getElementById("timerDisplay").style.display = "block";
        document.getElementById("stageInfo").style.display = "block";
        document.getElementById("legendBox").style.display = "block";
        document.getElementById("answerInput").focus();
        
        state = "STAGE1"; stage1Timer = 60; spawnTimer = 0;
        monsters = []; projectiles = []; explosions = [];
        
        clearInterval(intervalId);
        intervalId = setInterval(() => {
            if(state === "STAGE1") {
                stage1Timer--; document.getElementById("timerDisplay").innerText = `남은 시간: ${stage1Timer}초`;
                if(stage1Timer <= 0) gameWin();
            }
        }, 1000);
        requestAnimationFrame(gameLoop);
    };

    function spawnMonster() {
        const types = [
            { type: 'mean', emoji: '👹' }, 
            { type: 'median', emoji: '👽' }, 
            { type: 'mode', emoji: '👾' }
        ];
        const selected = types[Math.floor(Math.random() * types.length)];
        let count = currentDifficulty.count;
        if (selected.type === 'median' && count % 2 === 0) count += 1;
        
        const q = generateData(selected.type, count);
        let baseSpeed = 0.5 + Math.random() * 0.5;

        monsters.push({
            id: Math.random().toString(36).substr(2, 9),
            x: 50 + Math.random() * (canvas.width - 100), y: -50,
            emoji: selected.emoji, dataStr: q.data.join(', '), answer: q.answer,
            speed: baseSpeed * currentDifficulty.speedMulti,
            targeted: false
        });
    }

    document.getElementById("answerInput").addEventListener("keypress", function(e) { if (e.key === "Enter" && state === "STAGE1") fireCannon(); });

    window.fireCannon = function() {
        const inputEl = document.getElementById("answerInput");
        const val = parseInt(inputEl.value); inputEl.value = ''; inputEl.focus();
        if (isNaN(val)) return;

        let target = null; let maxY = -999;
        for(let i=0; i<monsters.length; i++) {
            if(monsters[i].answer === val && !monsters[i].targeted && monsters[i].y > maxY) { maxY = monsters[i].y; target = monsters[i]; }
        }
        if(target) {
            target.targeted = true;
            projectiles.push({ x: canvas.width / 2, y: 430, targetId: target.id, speed: 15 });
        }
    }

    function gameLoop() {
        if (state === "STAGE1") { updateStage1(); drawStage1(); animId = requestAnimationFrame(gameLoop); }
    }

    function updateStage1() {
        spawnTimer++;
        if (spawnTimer > 180) { spawnMonster(); spawnTimer = 0; }
        for (let i = 0; i < monsters.length; i++) {
            monsters[i].y += monsters[i].speed;
            if (monsters[i].y > 410) { gameOver(); return; }
        }
        for (let i = projectiles.length - 1; i >= 0; i--) {
            let p = projectiles[i];
            let target = monsters.find(m => m.id === p.targetId);
            if (!target) { projectiles.splice(i, 1); continue; }
            let dx = target.x - p.x, dy = target.y - p.y;
            let dist = Math.hypot(dx, dy);
            if (dist < p.speed + 20) {
                explosions.push({ x: target.x, y: target.y, radius: 5, maxRadius: 50, alpha: 1 });
                monsters = monsters.filter(m => m.id !== p.targetId);
                projectiles.splice(i, 1);
            } else {
                p.x += (dx / dist) * p.speed; p.y += (dy / dist) * p.speed;
            }
        }
        for (let i = explosions.length - 1; i >= 0; i--) {
            let e = explosions[i];
            e.radius += 2.5; e.alpha -= 0.05;
            if (e.alpha <= 0) explosions.splice(i, 1);
        }
    }

    function drawStage1() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 성벽
        ctx.fillStyle = "#7f8c8d"; ctx.fillRect(0, 450, canvas.width, 50);
        ctx.strokeStyle = "#2c3e50"; ctx.lineWidth = 2;
        for(let x = 0; x < canvas.width; x += 60) {
            for(let y = 450; y < 500; y += 15) {
                let offsetX = (y % 30 === 0) ? 30 : 0;
                ctx.strokeRect(x - offsetX, y, 60, 15);
            }
        }
        ctx.fillStyle = "#ecf0f1"; ctx.font = "bold 18px Arial"; ctx.textAlign = "center"; ctx.fillText("방어 성벽", canvas.width/2, 490);
        
        // 대포
        ctx.fillStyle = "#34495e"; ctx.beginPath(); ctx.arc(canvas.width / 2, 450, 25, Math.PI, 0); ctx.fill();
        ctx.fillStyle = "#2c3e50"; ctx.fillRect(canvas.width / 2 - 10, 410, 20, 40);

        // 이모티콘 몬스터
        ctx.textAlign = "center";
        for (let m of monsters) {
            ctx.font = "40px Arial";
            ctx.fillText(m.emoji, m.x, m.y + 15);
            ctx.fillStyle = "#2c3e50"; ctx.font = "bold 16px Arial"; 
            ctx.fillText(m.dataStr, m.x, m.y - 20);
        }

        // 포탄 & 폭발
        ctx.fillStyle = "#e67e22";
        for (let p of projectiles) {
            ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "#d35400"; ctx.stroke();
        }
        for (let e of explosions) {
            ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(231, 76, 60, ${e.alpha})`; ctx.fill();
        }
    }

    function gameOver() {
        state = "GAMEOVER"; clearInterval(intervalId); cancelAnimationFrame(animId);
        document.getElementById("stage1UI").style.display = "none";
        document.getElementById("resultScreen").style.display = "flex";
        document.getElementById("resultScreen").innerHTML = `<h2 style="color: #e74c3c; font-size: 40px;">성벽 파괴!</h2><p>몬스터가 성벽에 도달했습니다.</p><button class="btn" onclick="location.reload()">돌아가기</button>`;
    }

    function gameWin() {
        state = "GAMEWIN"; clearInterval(intervalId); cancelAnimationFrame(animId);
        document.getElementById("stage1UI").style.display = "none";
        document.getElementById("resultScreen").style.display = "flex";
        document.getElementById("resultScreen").innerHTML = `<h2 style="color: #2ecc71; font-size: 40px;">방어 성공! 🎉</h2><p>60초 동안 성벽을 지켜냈습니다!</p><button class="btn" onclick="location.reload()">돌아가기</button>`;
    }

    // ==========================================
    // 2. 러시안 룰렛 (총알 배분 보스전)
    // ==========================================
    const MAX_BOSS_HP = 50;
    let bossHp = MAX_BOSS_HP;
    let bossTurns = 4;
    let bossPos = 20; // right position (px)
    let isFiring = false;
    const magContainer = document.getElementById("magazines");
    let magInputs = [];

    function startRouletteGame() {
        bossHp = MAX_BOSS_HP; bossTurns = 4; bossPos = 20; isFiring = false;
        document.getElementById("stage2UI").style.display = "flex";
        document.getElementById("bossSprite").style.right = bossPos + "px";
        initMagazines(); updateBossUI();
    }

    function initMagazines() {
        magContainer.innerHTML = ''; magInputs = [];
        for (let i = 0; i < 6; i++) {
            let input = document.createElement("input");
            input.type = "number"; input.className = "magazine-input";
            input.value = (i === 5) ? 15 : 17; input.min = 0; input.max = 100;
            input.addEventListener("input", calculateStats);
            magContainer.appendChild(input); magInputs.push(input);
        }
        calculateStats();
    }

    function calculateStats() {
        let sum = 0; let values = [];
        magInputs.forEach(inp => { let val = parseInt(inp.value) || 0; sum += val; values.push(val); });
        const totalSpan = document.getElementById("totalDmg");
        const fireBtn = document.getElementById("fireBtn");
        totalSpan.innerText = sum;
        
        if (sum === 100) { totalSpan.style.color = "#2ecc71"; fireBtn.classList.add("active"); } 
        else { totalSpan.style.color = "#e74c3c"; fireBtn.classList.remove("active"); }

        let mean = sum / 6;
        let variance = values.reduce((acc, val) => acc + Math.pow(val - mean, 2), 0) / 6;
        let stdDev = Math.sqrt(variance);
        
        document.getElementById("stdDevText").innerText = stdDev.toFixed(1);
        let riskPercent = Math.min((stdDev / 37.3) * 100, 100);
        let bar = document.getElementById("stdDevBar");
        let riskText = document.getElementById("riskText");
        bar.style.width = riskPercent + "%";
        
        if (riskPercent < 15) { bar.style.background = "#2ecc71"; riskText.innerText = "(매우 안정적)"; riskText.style.color = "#2ecc71"; } 
        else if (riskPercent < 60) { bar.style.background = "#f1c40f"; riskText.innerText = "(도박성 증가)"; riskText.style.color = "#f1c40f"; } 
        else { bar.style.background = "#e74c3c"; riskText.innerText = "(하이 리스크!)"; riskText.style.color = "#e74c3c"; }
    }

    window.fireRoulette = function() {
        if (isFiring) return;
        let sum = 0; let values = [];
        magInputs.forEach(inp => { let val = parseInt(inp.value) || 0; sum += val; values.push(val); });
        if (sum !== 100) return;

        isFiring = true;
        document.getElementById("fireBtn").classList.remove("active");

        let firedIndex = Math.floor(Math.random() * 6);
        let damage = values[firedIndex];

        // 1. 총알 발사 애니메이션
        const bullet = document.getElementById("bulletSprite");
        const arenaWidth = document.querySelector(".battle-arena").offsetWidth;
        const targetX = arenaWidth - bossPos - 70; // 보스 위치 근처
        
        bullet.style.display = "block";
        bullet.style.left = "70px";
        bullet.style.transition = "left 0.3s linear";
        
        setTimeout(() => { bullet.style.left = targetX + "px"; }, 20);

        // 2. 명중 및 처리
        setTimeout(() => {
            bullet.style.display = "none";
            
            // 데미지 텍스트 효과
            const dmgText = document.createElement("div");
            dmgText.innerText = `-${damage}`;
            dmgText.style.position = "absolute"; dmgText.style.right = (bossPos + 20) + "px"; dmgText.style.top = "20px";
            dmgText.style.color = "#f1c40f"; dmgText.style.fontSize = "30px"; dmgText.style.fontWeight = "bold";
            dmgText.style.transition = "top 1s, opacity 1s"; dmgText.style.zIndex = "10";
            document.querySelector(".battle-arena").appendChild(dmgText);
            setTimeout(() => { dmgText.style.top = "-20px"; dmgText.style.opacity = "0"; }, 50);
            setTimeout(() => { dmgText.remove(); }, 1050);

            bossHp -= damage; bossTurns--;
            if(bossHp < 0) bossHp = 0;
            updateBossUI();

            setTimeout(() => {
                if (bossHp <= 0) {
                    showResultOverlay(`<h1 style="color: #2ecc71; font-size: 50px;">보스 격파! 🎉</h1><p>수학의 힘으로 보스를 쓰러뜨렸습니다!</p>`);
                } else if (bossTurns <= 0) {
                    // 보스가 끝까지 다가와서 패배
                    document.getElementById("bossSprite").style.right = (arenaWidth - 100) + "px";
                    setTimeout(() => { showResultOverlay(`<h1 style="color: #e74c3c; font-size: 50px;">패배... 😭</h1><p>보스에게 먹히고 말았습니다.</p>`); }, 500);
                } else {
                    // 보스가 한 칸 전진
                    let step = (arenaWidth - 100) / 4;
                    bossPos += step;
                    document.getElementById("bossSprite").style.right = bossPos + "px";
                    
                    initMagazines();
                    isFiring = false;
                }
            }, 1000);
        }, 320); // 총알 이동 시간 후
    };

    function updateBossUI() { 
        document.getElementById("bossHpTextUi").innerText = `HP: ${bossHp}`;
        let percent = (bossHp / MAX_BOSS_HP) * 100;
        document.getElementById("bossHpBar").style.width = percent + "%";
        document.getElementById("turnText").innerText = bossTurns;
    }

    function showResultOverlay(htmlContent) {
        const overlay = document.getElementById("resultScreen");
        overlay.style.display = "flex";
        overlay.innerHTML = htmlContent + `<button class="btn" onclick="location.reload()">모드 선택으로 돌아가기</button>`;
    }
</script>
</body>
</html>
