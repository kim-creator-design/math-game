<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼각비표 대포 타임어택</title>
<style>
    body { 
        display: flex; flex-direction: column; align-items: center; 
        font-family: 'Malgun Gothic', sans-serif; background-color: #2f3640; color: #f5f6fa; margin: 0; padding: 30px; 
    }
    .header { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .back-btn { text-decoration: none; color: white; background: #576574; padding: 10px 15px; border-radius: 8px; font-weight: bold; }
    
    .main-wrapper { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; width: 100%; max-width: 1000px; }
    
    .table-container { background: #353b48; padding: 20px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.3); width: 300px; height: fit-content; }
    .trig-table { width: 100%; border-collapse: collapse; text-align: center; background: white; color: black; border-radius: 8px; overflow: hidden; }
    .trig-table th { background: #2980b9; color: white; padding: 10px; }
    .trig-table td { padding: 8px; border-bottom: 1px solid #ddd; }
    
    .game-container { background: #353b48; padding: 20px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.3); flex: 1; min-width: 500px; text-align: center; position: relative; }
    canvas { background: linear-gradient(to bottom, #1e3799, #4a69bd); border-radius: 8px; border: 2px solid #7f8fa6; margin-top: 10px; width: 100%; }
    
    #status-header { font-size: 20px; margin-bottom: 10px; background: #f5f6fa; padding: 10px; border-radius: 8px; color: #2f3640; }
    #question-text { color: #fbc531; font-size: 28px; margin: 15px 0; }
    
    .input-area { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
    #answer-input { padding: 15px; font-size: 20px; width: 200px; border-radius: 8px; border: 2px solid #3498db; text-align: center; font-weight: bold; outline: none; }
    .fire-btn { padding: 15px 30px; font-size: 20px; background: #e74c3c; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .fire-btn:hover { background: #c0392b; transform: scale(1.05); }
</style>
</head>
<body>

    <div class="header">
        <a href="trig.html" class="back-btn">⬅ 메뉴로</a>
        <h2 style="margin: 0;">🚀 삼각비표 대포 쏘기 (주관식)</h2>
    </div>

    <div class="main-wrapper">
        <!-- 📊 왼쪽: 계속 바뀌는 삼각비표 -->
        <div class="table-container">
            <h3 style="color: #fbc531; text-align: center; margin-top: 0;">📊 삼각비표</h3>
            <table class="trig-table">
                <thead><tr><th>각도</th><th>sin</th><th>cos</th><th>tan</th></tr></thead>
                <tbody id="trig-tbody">
                    <!-- 자바스크립트가 무작위로 채워 넣습니다 -->
                </tbody>
            </table>
        </div>

        <!-- 🎮 오른쪽: 메인 게임 -->
        <div class="game-container">
            <div id="status-header">
                <span style="color: #e74c3c; font-weight: bold;">⏳ 남은 시간: 60초</span> &nbsp;|&nbsp; <span style="color: #2980b9; font-weight: bold;">🎯 명중: 0회</span>
            </div>
            
            <canvas id="gameCanvas" width="600" height="350"></canvas>
            
            <div id="start-section" style="margin: 20px 0;">
                <p style="font-size: 1.1em; margin-bottom: 15px;">1분 동안 표를 보고 <strong>정확한 값(소수점 4자리)</strong>을 입력해 악당을 맞혀보세요!</p>
                <button onclick="startCannonGame()" class="fire-btn" style="padding: 15px 40px; font-size: 24px;">🚨 게임 시작!</button>
            </div>

            <div id="play-section" style="display: none; position: relative;">
                <h2 id="question-text">문제</h2>
                <div class="input-area">
                    <input type="number" id="answer-input" step="0.0001" placeholder="예: 0.5592" autocomplete="off">
                    <button class="fire-btn" onclick="checkAnswer()">발사!</button>
                </div>
            </div>

            <div id="result-section" style="display: none; margin-top: 20px;">
                <h2 style="color: #fbc531; font-size: 36px; margin-bottom: 10px;">⏰ 시간 종료!</h2>
                <p id="result-score" style="font-size: 24px; margin-bottom: 20px;"></p>
                <button onclick="location.reload()" class="fire-btn" style="background: #27ae60;">다시 도전하기 🔄</button>
            </div>
        </div>
    </div>

<script>
let currentQuestionPool = [];
let score = 0;
let timeLeft = 60;
let gameTimer = null;
let currentQuestion = null;
let isPlaying = false;

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
let isFiring = false;
let cannonball = { progress: 0, startX: 0, startY: 0, destX: 0, destY: 0 };

// 🌟 무작위 삼각비표와 문제 목록 생성하는 함수
function refreshTrigTable() {
    let angles = [];
    while(angles.length < 9) {
        let deg = Math.floor(Math.random() * 89) + 1; // 1도 ~ 89도
        if(!angles.includes(deg)) angles.push(deg);
    }
    angles.sort((a, b) => a - b); // 각도 순서대로 정렬

    const tbody = document.getElementById("trig-tbody");
    tbody.innerHTML = "";
    currentQuestionPool = [];

    angles.forEach(deg => {
        const rad = deg * Math.PI / 180;
        const s = Math.sin(rad).toFixed(4);
        const c = Math.cos(rad).toFixed(4);
        const t = Math.tan(rad).toFixed(4);

        // 표에 추가
        tbody.innerHTML += `<tr><td>${deg}°</td><td>${s}</td><td>${c}</td><td>${t}</td></tr>`;

        // 문제 리스트에 추가
        currentQuestionPool.push({ q: `sin ${deg}°`, deg: deg, a: s });
        currentQuestionPool.push({ q: `cos ${deg}°`, deg: deg, a: c });
        currentQuestionPool.push({ q: `tan ${deg}°`, deg: deg, a: t });
    });
}

// 엔터키 누르면 발사
document.getElementById("answer-input").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        event.preventDefault();
        checkAnswer();
    }
});

// 처음 켰을 때 표 한번 그려주기
refreshTrigTable();
drawScene();

function startCannonGame() {
    score = 0; timeLeft = 60; isPlaying = true;
    document.getElementById("start-section").style.display = "none";
    document.getElementById("play-section").style.display = "block";
    
    updateHeaderDisplay();
    loadRandomQuestion();
    
    clearInterval(gameTimer);
    gameTimer = setInterval(() => {
        timeLeft--;
        updateHeaderDisplay();
        if (timeLeft <= 0) endCannonGame();
    }, 1000);
    
    requestAnimationFrame(drawScene);
}

function updateHeaderDisplay() {
    document.getElementById("status-header").innerHTML = 
        `<span style="color: #e74c3c; font-weight: bold;">⏳ 남은 시간: ${timeLeft}초</span> &nbsp;|&nbsp; <span style="color: #2980b9; font-weight: bold;">🎯 명중: ${score}회</span>`;
}

function loadRandomQuestion() {
    const randomIndex = Math.floor(Math.random() * currentQuestionPool.length);
    currentQuestion = currentQuestionPool[randomIndex];
    document.getElementById("question-text").innerText = `조준 목표: ${currentQuestion.q}`;
    
    const input = document.getElementById("answer-input");
    input.value = "";
    input.focus();
}

function checkAnswer() {
    if (!isPlaying || isFiring) return; 
    
    const inputVal = document.getElementById("answer-input").value.trim();
    if (inputVal === "") return; 
    
    isFiring = true;
    cannonball.progress = 0;
    
    const isCorrect = (inputVal === currentQuestion.a);
    
    const rad = currentQuestion.deg * Math.PI / 180;
    const targetDist = 220; 
    const cbX = canvas.width / 4; 
    const cbY = canvas.height - 20;
    
    cannonball.startX = cbX;
    cannonball.startY = cbY;
    
    if (isCorrect) {
        cannonball.destX = cbX + Math.cos(rad) * targetDist;
        cannonball.destY = cbY - Math.sin(rad) * targetDist;
    } else {
        const missRad = rad + (Math.random() > 0.5 ? 0.4 : -0.4); 
        cannonball.destX = cbX + Math.cos(missRad) * (targetDist + 150);
        cannonball.destY = cbY - Math.sin(missRad) * (targetDist + 150);
    }
    
    const fireAnim = setInterval(() => {
        cannonball.progress += 0.04; 
        if (cannonball.progress >= 1) {
            clearInterval(fireAnim);
            isFiring = false;
            
            if (isCorrect) {
                score++;
                updateHeaderDisplay();
                showFeedback("💥 명중!", "#2ecc71");
                
                // 🌟 정답을 맞혔으니 표를 무작위로 새로 갱신!
                refreshTrigTable(); 
                loadRandomQuestion();
            } else {
                showFeedback("❌ 빗나갔습니다!", "#e74c3c"); 
                document.getElementById("answer-input").value = "";
                document.getElementById("answer-input").focus();
            }
        }
    }, 15);
}

function showFeedback(text, color) {
    const feedbackMsg = document.createElement("div");
    feedbackMsg.style.position = "absolute";
    feedbackMsg.style.top = "100px";
    feedbackMsg.style.left = "50%";
    feedbackMsg.style.transform = "translateX(-50%)";
    feedbackMsg.style.fontSize = "40px";
    feedbackMsg.style.fontWeight = "bold";
    feedbackMsg.style.color = color;
    feedbackMsg.style.textShadow = "2px 2px 4px #000";
    feedbackMsg.innerText = text;
    document.querySelector(".game-container").appendChild(feedbackMsg);
    setTimeout(() => { if(feedbackMsg.parentNode) feedbackMsg.parentNode.removeChild(feedbackMsg); }, 800);
}

function endCannonGame() {
    isPlaying = false; clearInterval(gameTimer);
    document.getElementById("play-section").style.display = "none";
    document.getElementById("result-section").style.display = "block";
    document.getElementById("result-score").innerHTML = `총 <strong style="color: #e74c3c; font-size: 32px;">${score}명</strong>의 악당을 처치했습니다!`;
}

function drawScene() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    const cbX = canvas.width / 4; 
    const cbY = canvas.height - 20;
    
    if((isPlaying || document.getElementById("result-section").style.display.includes("block")) && currentQuestion) {
        const rad = currentQuestion.deg * Math.PI / 180;
        const targetDist = 220;
        const targetX = cbX + Math.cos(rad) * targetDist;
        const targetY = cbY - Math.sin(rad) * targetDist;
        
        ctx.font = "50px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("😈", targetX, targetY);
        
        ctx.save();
        ctx.translate(cbX, cbY);
        ctx.rotate(-rad); 
        ctx.fillStyle = '#7f8fa6';
        ctx.fillRect(0, -15, 60, 30);
        ctx.restore();
    } else {
        ctx.save();
        ctx.translate(cbX, cbY);
        ctx.rotate(-Math.PI/4);
        ctx.fillStyle = '#7f8fa6';
        ctx.fillRect(0, -15, 60, 30);
        ctx.restore();
    }
    
    ctx.fillStyle = '#2f3640';
    ctx.beginPath();
    ctx.arc(cbX, cbY, 25, 0, Math.PI * 2);
    ctx.fill();
    
    if (isFiring) {
        const currentX = cannonball.startX + (cannonball.destX - cannonball.startX) * cannonball.progress;
        const currentY = cannonball.startY + (cannonball.destY - cannonball.startY) * cannonball.progress;
        
        ctx.beginPath();
        ctx.arc(currentX, currentY, 10, 0, Math.PI * 2);
        ctx.fillStyle = "#e1b12c";
        ctx.fill();
        ctx.closePath();
    }
    
    requestAnimationFrame(drawScene);
}
</script>
</body>
</html>
