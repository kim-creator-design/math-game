<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼각비 대포 타임어택</title>
<style>
    body { 
        display: flex; flex-direction: column; align-items: center; 
        font-family: 'Malgun Gothic', sans-serif; background-color: #2f3640; color: #f5f6fa; margin: 0; padding: 30px; 
    }
    #game-container, #start-screen, #result-screen {
        background: #353b48; padding: 20px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        text-align: center; width: 600px;
    }
    canvas { background: linear-gradient(to bottom, #1e3799, #4a69bd); border-radius: 8px; border: 2px solid #7f8fa6; margin-top: 10px; }
    
    .option-btn {
        padding: 15px 25px; margin: 10px; font-size: 20px; cursor: pointer;
        background: #3498db; color: white; border: none; border-radius: 8px; font-weight: bold; transition: 0.2s;
    }
    .option-btn:hover { background: #2980b9; transform: scale(1.05); }
    
    .start-btn {
        padding: 15px 40px; font-size: 24px; cursor: pointer; background: #e74c3c; color: white; border: none; border-radius: 10px; font-weight: bold; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    .start-btn:hover { background: #c0392b; }
    
    #status-header { font-size: 22px; margin-bottom: 10px; background: #f5f6fa; padding: 10px; border-radius: 8px; color: #2f3640; }
    #question-text { color: #fbc531; font-size: 28px; margin: 15px 0; }
</style>
</head>
<body>

    <!-- 🌟 1. 시작 화면 -->
    <div id="start-screen">
        <h1 style="color: #fbc531;">🚀 대포 쏘기: 1분 타임어택!</h1>
        <p style="font-size: 1.2em;">1분 동안 최대한 많은 악당을 맞춰보세요!</p>
        <button class="start-btn" onclick="startCannonGame()">🚨 게임 시작!</button>
    </div>

    <!-- 🌟 2. 게임 화면 (처음엔 숨김) -->
    <div id="game-container" style="display: none;">
        <div id="status-header"></div>
        <canvas id="gameCanvas" width="600" height="300"></canvas>
        <div style="position: relative;">
            <h2 id="question-text">문제</h2>
            <!-- 보기(정답) 버튼들이 들어갈 공간 -->
            <div id="options-area"></div> 
        </div>
    </div>

    <!-- 🌟 3. 결과 화면 (처음엔 숨김) -->
    <div id="result-screen" style="display: none;">
        <div id="result-text"></div>
        <button class="start-btn" onclick="location.reload()">다시 도전하기 🔄</button>
    </div>

<!-- 🌟 4. 게임 자바스크립트 로직 -->
<script>
const allQuestions = [
    { q: "sin 30°", a: "1/2", options: ["1/2", "√2/2", "√3/2", "1"] },
    { q: "cos 30°", a: "√3/2", options: ["1/2", "√2/2", "√3/2", "1"] },
    { q: "tan 30°", a: "√3/3", options: ["√3/3", "1", "√3", "0"] },
    { q: "sin 45°", a: "√2/2", options: ["1/2", "√2/2", "√3/2", "1"] },
    { q: "cos 45°", a: "√2/2", options: ["1/2", "√2/2", "√3/2", "1"] },
    { q: "tan 45°", a: "1", options: ["√3/3", "1", "√3", "0"] },
    { q: "sin 60°", a: "√3/2", options: ["1/2", "√2/2", "√3/2", "1"] },
    { q: "cos 60°", a: "1/2", options: ["1/2", "√2/2", "√3/2", "1"] },
    { q: "tan 60°", a: "√3", options: ["√3/3", "1", "√3", "0"] }
];

let score = 0;
let timeLeft = 60; // 1분 타이머
let gameTimer = null;
let currentQuestion = null;
let isPlaying = false;

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
let isFiring = false;
let cannonball = { x: 0, y: 0, progress: 0 };

function startCannonGame() {
    score = 0;
    timeLeft = 60;
    isPlaying = true;
    
    document.getElementById("start-screen").style.display = "none";
    document.getElementById("result-screen").style.display = "none";
    document.getElementById("game-container").style.display = "block";
    
    updateHeaderDisplay();
    loadRandomQuestion();
    
    // 1초마다 타이머 감소
    clearInterval(gameTimer);
    gameTimer = setInterval(() => {
        timeLeft--;
        updateHeaderDisplay();
        
        if (timeLeft <= 0) {
            endCannonGame();
        }
    }, 1000);
    
    requestAnimationFrame(drawScene);
}

function updateHeaderDisplay() {
    const header = document.getElementById("status-header");
    if(header) {
        header.innerHTML = `<span style="color: #e74c3c; font-weight: bold;">⏳ 남은 시간: ${timeLeft}초</span> &nbsp;|&nbsp; <span style="color: #2980b9; font-weight: bold;">🎯 명중: ${score}회</span>`;
    }
}

function loadRandomQuestion() {
    const randomIndex = Math.floor(Math.random() * allQuestions.length);
    currentQuestion = allQuestions[randomIndex];
    
    document.getElementById("question-text").innerText = `목표: ${currentQuestion.q}`;
    
    const shuffledOptions = [...currentQuestion.options].sort(() => Math.random() - 0.5);
    const optionsArea = document.getElementById("options-area");
    optionsArea.innerHTML = "";
    
    shuffledOptions.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => fireCannon(opt, currentQuestion.a);
        optionsArea.appendChild(btn);
    });
}

function fireCannon(selectedAnswer, correctAnswer) {
    if (!isPlaying || isFiring) return; 
    
    isFiring = true;
    cannonball.progress = 0;
    
    const fireAnim = setInterval(() => {
        cannonball.progress += 0.05; // 포탄 날아가는 속도
        if (cannonball.progress >= 1) {
            clearInterval(fireAnim);
            isFiring = false;
            
            if (selectedAnswer === correctAnswer) {
                score++;
                updateHeaderDisplay();
                showFeedback("💥 명중!", "#2ecc71");
                loadRandomQuestion(); // 맞히면 새 문제 나옴
            } else {
                showFeedback("❌ 빗나갔습니다!", "#e74c3c"); // 틀리면 문제 그대로
            }
        }
    }, 15);
}

// 명중/오답 시 화면에 글씨 띄우는 효과
function showFeedback(text, color) {
    const feedbackMsg = document.createElement("div");
    feedbackMsg.style.position = "absolute";
    feedbackMsg.style.top = "120px";
    feedbackMsg.style.left = "50%";
    feedbackMsg.style.transform = "translateX(-50%)";
    feedbackMsg.style.fontSize = "40px";
    feedbackMsg.style.fontWeight = "bold";
    feedbackMsg.style.color = color;
    feedbackMsg.style.textShadow = "2px 2px 4px #000";
    feedbackMsg.innerText = text;
    
    document.getElementById("game-container").appendChild(feedbackMsg);
    
    setTimeout(() => {
        if(feedbackMsg.parentNode) feedbackMsg.parentNode.removeChild(feedbackMsg);
    }, 800);
}

function endCannonGame() {
    isPlaying = false;
    clearInterval(gameTimer);
    
    document.getElementById("game-container").style.display = "none";
    document.getElementById("result-screen").style.display = "block";
    
    const resultText = document.getElementById("result-text");
    resultText.innerHTML = `<h2 style="color: #fbc531; font-size: 36px;">⏰ 시간 종료!</h2>
                            <p style="font-size: 24px;">총 <strong style="color: #e74c3c; font-size: 32px;">${score}명</strong>의 악당을 처치했습니다!</p>`;
}

// 캔버스 애니메이션
function drawScene() {
    if (!isPlaying) return;
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 😈 악당 그리기
    const targetX = canvas.width / 2;
    const targetY = 60;
    ctx.font = "50px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("😈", targetX, targetY);
    
    // 대포 본체 
    const cannonBaseX = canvas.width / 2;
    const cannonBaseY = canvas.height - 20;
    
    ctx.fillStyle = '#7f8fa6';
    ctx.fillRect(cannonBaseX - 30, cannonBaseY - 30, 60, 50);
    ctx.fillStyle = '#2f3640';
    ctx.beginPath();
    ctx.arc(cannonBaseX, cannonBaseY, 25, 0, Math.PI * 2);
    ctx.fill();
    
    // 날아가는 포탄
    if (isFiring) {
        const currentX = cannonBaseX + (targetX - cannonBaseX) * cannonball.progress;
        const currentY = cannonBaseY - 30 + (targetY - (cannonBaseY - 30)) * cannonball.progress;
        
        ctx.beginPath();
        ctx.arc(currentX, currentY, 12, 0, Math.PI * 2);
        ctx.fillStyle = "#e1b12c";
        ctx.fill();
        ctx.closePath();
    }
    
    requestAnimationFrame(drawScene);
}
</script>
</body>
</html>
