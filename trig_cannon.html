<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼각비표 대포 타임어택</title>
<style>
    body { 
        display: flex; flex-direction: column; align-items: center; 
        font-family: 'Malgun Gothic', sans-serif; background-color: #2f3640; color: #f5f6fa; margin: 0; padding: 30px; 
    }
    .header {
        width: 600px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
    }
    .back-btn {
        text-decoration: none; color: white; background: #576574; padding: 10px 15px; border-radius: 8px; font-weight: bold;
    }
    #game-container {
        background: #353b48; padding: 20px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        text-align: center; width: 600px;
    }
    canvas { background: linear-gradient(to bottom, #1e3799, #4a69bd); border-radius: 8px; border: 2px solid #7f8fa6; margin-top: 10px; }
    
    .option-btn {
        padding: 15px 25px; margin: 10px; font-size: 20px; cursor: pointer;
        background: #3498db; color: white; border: none; border-radius: 8px; font-weight: bold; transition: 0.2s;
    }
    .option-btn:hover { background: #2980b9; transform: scale(1.05); }
    
    #status-header { font-size: 22px; margin-bottom: 10px; background: #f5f6fa; padding: 10px; border-radius: 8px; color: #2f3640; }
    #question-text { color: #fbc531; font-size: 28px; margin: 15px 0; }
    #options-area { display: flex; flex-wrap: wrap; justify-content: center; }
</style>
</head>
<body>

    <div class="header">
        <a href="trig.html" class="back-btn">⬅ 메뉴로</a>
        <h2 style="margin: 0;">🚀 삼각비표 대포 쏘기</h2>
    </div>

    <!-- 🌟 게임 메인 화면 -->
    <div id="game-container">
        <div id="status-header">
            <span style="color: #e74c3c; font-weight: bold;">⏳ 남은 시간: 60초</span> &nbsp;|&nbsp; <span style="color: #2980b9; font-weight: bold;">🎯 명중: 0회</span>
        </div>
        
        <!-- 대포가 그려지는 캔버스 -->
        <canvas id="gameCanvas" width="600" height="300"></canvas>
        
        <!-- 🌟 대기 상태: 시작 버튼 영역 -->
        <div id="start-section" style="margin: 20px 0;">
            <p style="font-size: 1.2em; margin-bottom: 15px;">1분 동안 삼각비표의 값을 최대한 많이 맞혀보세요!</p>
            <button onclick="startCannonGame()" style="padding: 15px 40px; font-size: 24px; background: #e74c3c; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.2);">🚨 게임 시작!</button>
        </div>

        <!-- 🌟 플레이 상태: 문제 및 보기 영역 (처음엔 숨김) -->
        <div id="play-section" style="display: none; position: relative;">
            <h2 id="question-text">문제</h2>
            <div id="options-area"></div> 
        </div>

        <!-- 🌟 종료 상태: 결과 영역 (처음엔 숨김) -->
        <div id="result-section" style="display: none; margin-top: 20px;">
            <h2 style="color: #fbc531; font-size: 36px; margin-bottom: 10px;">⏰ 시간 종료!</h2>
            <p id="result-score" style="font-size: 24px; margin-bottom: 20px;"></p>
            <button onclick="location.reload()" style="padding: 15px 30px; font-size: 20px; background: #27ae60; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">다시 도전하기 🔄</button>
        </div>
    </div>

<script>
// 삼각비표 문제 데이터 (소수점 4자리)
const allQuestions = [
    { q: "sin 34°", a: "0.5592", options: ["0.5592", "0.8290", "0.6745", "0.5446"] },
    { q: "cos 56°", a: "0.5592", options: ["0.5592", "0.8290", "0.8090", "0.6745"] },
    { q: "tan 40°", a: "0.8391", options: ["0.8391", "0.6428", "0.7660", "1.1918"] },
    { q: "sin 70°", a: "0.9397", options: ["0.9397", "0.3420", "2.7475", "0.8391"] },
    { q: "cos 25°", a: "0.9063", options: ["0.9063", "0.4226", "0.4663", "0.8988"] },
    { q: "tan 65°", a: "2.1445", options: ["2.1445", "0.4226", "0.9063", "1.1918"] },
    { q: "sin 15°", a: "0.2588", options: ["0.2588", "0.9659", "0.2679", "0.5000"] },
    { q: "cos 80°", a: "0.1736", options: ["0.1736", "0.9848", "5.6713", "0.3420"] },
    { q: "tan 55°", a: "1.4281", options: ["1.4281", "0.5736", "0.8192", "0.8391"] }
];

let score = 0;
let timeLeft = 60;
let gameTimer = null;
let currentQuestion = null;
let isPlaying = false;

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
let isFiring = false;
let cannonball = { x: 0, y: 0, progress: 0 };

// 초기 화면 렌더링용
drawScene();

function startCannonGame() {
    score = 0;
    timeLeft = 60;
    isPlaying = true;
    
    // UI 전환: 시작 버튼 숨기고 문제 영역 보이기
    document.getElementById("start-section").style.display = "none";
    document.getElementById("play-section").style.display = "block";
    
    updateHeaderDisplay();
    loadRandomQuestion();
    
    clearInterval(gameTimer);
    gameTimer = setInterval(() => {
        timeLeft--;
        updateHeaderDisplay();
        
        if (timeLeft <= 0) {
            endCannonGame();
        }
    }, 1000);
    
    requestAnimationFrame(drawScene);
}

function updateHeaderDisplay() {
    document.getElementById("status-header").innerHTML = 
        `<span style="color: #e74c3c; font-weight: bold;">⏳ 남은 시간: ${timeLeft}초</span> &nbsp;|&nbsp; <span style="color: #2980b9; font-weight: bold;">🎯 명중: ${score}회</span>`;
}

function loadRandomQuestion() {
    const randomIndex = Math.floor(Math.random() * allQuestions.length);
    currentQuestion = allQuestions[randomIndex];
    
    document.getElementById("question-text").innerText = `목표: ${currentQuestion.q}`;
    
    const shuffledOptions = [...currentQuestion.options].sort(() => Math.random() - 0.5);
    const optionsArea = document.getElementById("options-area");
    optionsArea.innerHTML = "";
    
    shuffledOptions.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => fireCannon(opt, currentQuestion.a);
        optionsArea.appendChild(btn);
    });
}

function fireCannon(selectedAnswer, correctAnswer) {
    if (!isPlaying || isFiring) return; 
    
    isFiring = true;
    cannonball.progress = 0;
    
    const fireAnim = setInterval(() => {
        cannonball.progress += 0.05; 
        if (cannonball.progress >= 1) {
            clearInterval(fireAnim);
            isFiring = false;
            
            if (selectedAnswer === correctAnswer) {
                score++;
                updateHeaderDisplay();
                showFeedback("💥 명중!", "#2ecc71");
                loadRandomQuestion();
            } else {
                showFeedback("❌ 빗나갔습니다!", "#e74c3c"); 
            }
        }
    }, 15);
}

function showFeedback(text, color) {
    const feedbackMsg = document.createElement("div");
    feedbackMsg.style.position = "absolute";
    feedbackMsg.style.top = "80px";
    feedbackMsg.style.left = "50%";
    feedbackMsg.style.transform = "translateX(-50%)";
    feedbackMsg.style.fontSize = "40px";
    feedbackMsg.style.fontWeight = "bold";
    feedbackMsg.style.color = color;
    feedbackMsg.style.textShadow = "2px 2px 4px #000";
    feedbackMsg.innerText = text;
    
    document.getElementById("game-container").appendChild(feedbackMsg);
    
    setTimeout(() => {
        if(feedbackMsg.parentNode) feedbackMsg.parentNode.removeChild(feedbackMsg);
    }, 800);
}

function endCannonGame() {
    isPlaying = false;
    clearInterval(gameTimer);
    
    document.getElementById("play-section").style.display = "none";
    document.getElementById("result-section").style.display = "block";
    
    document.getElementById("result-score").innerHTML = `총 <strong style="color: #e74c3c; font-size: 32px;">${score}명</strong>의 악당을 처치했습니다!`;
}

function drawScene() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    const targetX = canvas.width / 2;
    const targetY = 60;
    
    // 악당 (시작 전이나 게임 중일 때만 보임)
    if(isPlaying || !document.getElementById("result-section").style.display.includes("block")) {
        ctx.font = "50px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("😈", targetX, targetY);
    }
    
    const cannonBaseX = canvas.width / 2;
    const cannonBaseY = canvas.height - 20;
    
    ctx.fillStyle = '#7f8fa6';
    ctx.fillRect(cannonBaseX - 30, cannonBaseY - 30, 60, 50);
    ctx.fillStyle = '#2f3640';
    ctx.beginPath();
    ctx.arc(cannonBaseX, cannonBaseY, 25, 0, Math.PI * 2);
    ctx.fill();
    
    if (isFiring) {
        const currentX = cannonBaseX + (targetX - cannonBaseX) * cannonball.progress;
        const currentY = cannonBaseY - 30 + (targetY - (cannonBaseY - 30)) * cannonball.progress;
        
        ctx.beginPath();
        ctx.arc(currentX, currentY, 12, 0, Math.PI * 2);
        ctx.fillStyle = "#e1b12c";
        ctx.fill();
        ctx.closePath();
    }
    
    if(isPlaying) {
        requestAnimationFrame(drawScene);
    }
}
</script>
</body>
</html>
