<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼각비 대포 게임</title>
<style>
    /* 전체 레이아웃 및 디자인 */
    body { 
        display: flex; 
        font-family: 'Malgun Gothic', sans-serif; 
        background-color: #2f3640; 
        color: #f5f6fa; 
        margin: 0; 
        padding: 30px; 
        justify-content: center;
        gap: 30px;
    }
    h2 { margin-top: 0; color: #fbc531; }
    
    #game-wrapper {
        background: #353b48;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }
    canvas { 
        background: linear-gradient(to bottom, #1e3799, #4a69bd); 
        border-radius: 8px; 
        border: 2px solid #7f8fa6;
    }
    
    #controls { 
        margin-top: 20px; 
        padding: 15px;
        background: #2f3640;
        border-radius: 8px;
        text-align: center;
    }
    .mission-text { font-size: 1.1em; margin-bottom: 15px; color: #00a8ff; font-weight: bold; }
    input[type="number"] { 
        padding: 10px; 
        width: 80px; 
        font-size: 18px; 
        border-radius: 6px;
        border: none;
        text-align: center;
    }
    button { 
        padding: 10px 24px; 
        font-size: 18px; 
        cursor: pointer; 
        background: #e84118; 
        color: white; 
        border: none; 
        border-radius: 6px; 
        font-weight: bold;
        transition: background 0.3s;
    }
    button:hover { background: #c23616; }

    #sidebar { 
        background: #353b48; 
        padding: 20px; 
        border-radius: 12px; 
        box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        min-width: 200px;
    }
    table { 
        border-collapse: collapse; 
        width: 100%; 
        text-align: center; 
        background: #f5f6fa;
        color: #2f3640;
        border-radius: 8px;
        overflow: hidden;
    }
    th, td { border: 1px solid #dcdde1; padding: 12px; }
    th { background: #718093; color: white; }
    .highlight-tan { color: #c23616; font-weight: bold; font-size: 1.1em; }
</style>
</head>
<body>

    <div id="game-wrapper">
        <h2>🏰 성벽 방어: 몬스터를 명중시켜라!</h2>
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        
        <div id="controls">
            <div class="mission-text" id="mission-text">
                적까지의 거리(밑변): 100m | 적의 높이(높이): ?m
            </div>
            <label>대포 각도: </label>
            <input type="number" id="angle-input" placeholder="0~90" value="45"> 도 
            <button onclick="fireCannon()">🚀 발사!</button>
        </div>
    </div>

    <div id="sidebar">
        <h3 style="color: #fbc531;">📝 탄젠트(tan) 표</h3>
        <p style="font-size: 0.9em; color:#dcdde1;">※ tan(각도) = 높이 / 밑변</p>
        <table id="trig-table">
            <thead>
                <tr>
                    <th>각도</th>
                    <th>tan (탄젠트)</th>
                </tr>
            </thead>
            <tbody id="table-body">
            </tbody>
        </table>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const tableBody = document.getElementById('table-body');
    const missionText = document.getElementById('mission-text');
    const angleInput = document.getElementById('angle-input');

    let targetAngle = 0;
    let targetDistance = 100;
    let targetHeight = 0;
    let isFiring = false;

    const originX = 50;
    const originY = 350;
    const scale = 4; 

    function initGame() {
        isFiring = false;
        angleInput.value = '45';
        
        targetAngle = Math.floor(Math.random() * 15) + 25; 
        
        const tanValue = Math.tan(targetAngle * Math.PI / 180);
        targetHeight = (targetDistance * tanValue).toFixed(4); 

        missionText.innerText = `거리(밑변): ${targetDistance}m | 적의 높이(높이): ${targetHeight}m`;

        drawScene();
        generateTable();
    }

    function drawScene() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = '#2f3640';
        ctx.fillRect(0, originY, canvas.width, canvas.height - originY);

        const targetCanvasX = originX + (targetDistance * scale);
        const targetCanvasY = originY - (targetHeight * scale); 
        
        ctx.fillStyle = '#7f8fa6';
        ctx.fillRect(targetCanvasX - 15, targetCanvasY, 30, originY - targetCanvasY);
        
        ctx.font = "40px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("👹", targetCanvasX, targetCanvasY - 15);

        ctx.save();
        ctx.translate(originX, originY - 10); 
        ctx.rotate(-45 * Math.PI / 180); 
        
        ctx.fillStyle = '#718093'; 
        ctx.fillRect(0, -12, 55, 24); 
        ctx.fillStyle = '#2f3640'; 
        ctx.fillRect(45, -14, 10, 28);
        ctx.restore(); 

        ctx.fillStyle = '#e1b12c';
        ctx.beginPath();
        ctx.arc(originX, originY - 10, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#2f3640';
        ctx.beginPath();
        ctx.arc(originX, originY - 10, 6, 0, Math.PI * 2);
        ctx.fill();
    }

    function generateTable() {
        tableBody.innerHTML = '';
        const startAngle = targetAngle - 4; 

        for(let a = startAngle; a <= startAngle + 9; a++) {
            const rad = a * Math.PI / 180;
            const tan = Math.tan(rad).toFixed(4);
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>${a}°</b></td>
                <td class="highlight-tan">${tan}</td>
            `;
            tableBody.appendChild(tr);
        }
    }

    function fireCannon() {
        if(isFiring) return; 
        
        const inputAngle = parseFloat(angleInput.value);
        if(isNaN(inputAngle) || inputAngle <= 0 || inputAngle >= 90) {
            alert("0에서 90 사이의 각도를 정확히 입력해주세요!");
            return;
        }

        isFiring = true;
        let ballX = originX;
        let ballY = originY - 10; 
        
        const speed = 10; 
        
        // ★ 핵심 수정 로직: 크면 위로, 작으면 아래로! (격차는 7.5도로 축소)
        let finalAngleToShoot;
        let isCorrect = (Math.round(inputAngle) === targetAngle);
        
        if (isCorrect) {
            finalAngleToShoot = targetAngle; // 정답: 명중
        } else if (inputAngle > targetAngle) {
            finalAngleToShoot = targetAngle + 7.5; // 너무 큰 각도: 살짝 위로 빗나감
        } else {
            finalAngleToShoot = targetAngle - 7.5; // 너무 작은 각도: 살짝 아래로 빗나감
        }

        const rad = finalAngleToShoot * Math.PI / 180;
        const vx = Math.cos(rad) * speed;
        const vy = -Math.sin(rad) * speed; 

        function animate() {
            drawScene(); 
            
            ctx.fillStyle = '#ff7f50';
            ctx.beginPath();
            ctx.arc(ballX, ballY, 8, 0, Math.PI * 2);
            ctx.fill();

            ballX += vx;
            ballY += vy;

            // ★ 바닥(originY)에 떨어지거나 화면 밖으로 나갔을 때
            if (ballX > canvas.width || ballY < 0 || ballY >= originY) {
                if (!isCorrect) {
                    if (inputAngle > targetAngle) {
                        alert(`앗! 각도가 너무 큽니다. 몬스터 위로 날아갔군요!\n(입력: ${inputAngle}도 / 정답 아님)`);
                    } else {
                        alert(`앗! 각도가 너무 작습니다. 몬스터 아래 성벽에 맞았군요!\n(입력: ${inputAngle}도 / 정답 아님)`);
                    }
                }
                isFiring = false;
                drawScene();
                return;
            }

            const targetCanvasX = originX + (targetDistance * scale);
            const targetCanvasY = originY - (targetHeight * scale) - 15;
            
            const dist = Math.hypot(ballX - targetCanvasX, ballY - targetCanvasY);
            
            if (isCorrect && dist < 25) { 
                ctx.font = "50px Arial";
                ctx.fillText("💥", targetCanvasX, targetCanvasY);
                
                setTimeout(() => {
                    alert(`정확합니다! ${targetAngle}도를 완벽하게 계산하셨군요!`);
                    initGame(); 
                }, 200);
                return; 
            }

            requestAnimationFrame(animate);
        }
        
        animate();
    }

    window.onload = initGame;
</script>
</body>
</html>
