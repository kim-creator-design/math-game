<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼각비 대포 게임 - 타임어택</title>
<style>
    body { 
        display: flex; 
        font-family: 'Malgun Gothic', sans-serif; 
        background-color: #2f3640; 
        color: #f5f6fa; 
        margin: 0; 
        padding: 30px; 
        justify-content: center;
        gap: 30px;
    }
    h2 { margin-top: 0; color: #fbc531; }
    
    #game-wrapper {
        background: #353b48;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }
    canvas { 
        background: linear-gradient(to bottom, #1e3799, #4a69bd); 
        border-radius: 8px; 
        border: 2px solid #7f8fa6;
    }
    
    #controls { 
        margin-top: 20px; 
        padding: 15px;
        background: #2f3640;
        border-radius: 8px;
        text-align: center;
    }
    .mission-text { font-size: 1.1em; margin-bottom: 15px; color: #00a8ff; font-weight: bold; }
    #timer-text { font-size: 26px; color: #ff4757; font-weight: bold; margin-bottom: 10px; }
    
    input[type="number"] { 
        padding: 10px; 
        width: 80px; 
        font-size: 18px; 
        border-radius: 6px;
        border: none;
        text-align: center;
    }
    button { 
        padding: 10px 24px; 
        font-size: 18px; 
        cursor: pointer; 
        background: #e84118; 
        color: white; 
        border: none; 
        border-radius: 6px; 
        font-weight: bold;
        transition: background 0.3s;
    }
    button:hover { background: #c23616; }

    #sidebar { 
        background: #353b48; 
        padding: 20px; 
        border-radius: 12px; 
        box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        min-width: 200px;
    }
    table { 
        border-collapse: collapse; 
        width: 100%; 
        text-align: center; 
        background: #f5f6fa;
        color: #2f3640;
        border-radius: 8px;
        overflow: hidden;
    }
    th, td { border: 1px solid #dcdde1; padding: 12px; }
    th { background: #718093; color: white; }
    .highlight-tan { color: #c23616; font-weight: bold; font-size: 1.1em; }
</style>
</head>
<body>

    <div id="game-wrapper">
        <h2>🏰 성벽 방어: 타임어택!</h2>
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        
        <div id="controls">
            <div id="timer-text">⏳ 남은 시간: 5초</div>
            <div class="mission-text" id="mission-text">
                적까지의 거리(밑변): 100m | 적의 높이(높이): ?m
            </div>
            <label>대포 각도: </label>
            <input type="number" id="angle-input" placeholder="0~90" value="45"> 도 
            <button onclick="fireCannon()">🚀 발사!</button>
        </div>
    </div>

    <div id="sidebar">
        <h3 style="color: #fbc531;">📝 탄젠트(tan) 표</h3>
        <p style="font-size: 0.9em; color:#dcdde1;">※ tan(각도) = 높이 / 밑변</p>
        <table id="trig-table">
            <thead>
                <tr>
                    <th>각도</th>
                    <th>tan (탄젠트)</th>
                </tr>
            </thead>
            <tbody id="table-body">
            </tbody>
        </table>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const tableBody = document.getElementById('table-body');
    const missionText = document.getElementById('mission-text');
    const angleInput = document.getElementById('angle-input');
    const timerText = document.getElementById('timer-text');

    let targetAngle = 0;
    let targetDistance = 100;
    let targetHeight = 0;
    let visualTargetHeight = 0; // 시각적으로 1/3로 축소된 높이
    let isFiring = false;

    let timeLeft = 6;
    let timerInterval;

    const originX = 50;
    const originY = 350;
    const scale = 3; 

    function initGame() {
        isFiring = false;
        angleInput.value = '45';
        
        // 고각도(최대 70도)까지 문제를 확장했습니다!
        targetAngle = Math.floor(Math.random() * 45) + 25; 
        
        const tanValue = Math.tan(targetAngle * Math.PI / 180);
        targetHeight = (targetDistance * tanValue).toFixed(4); 

        // ★ 시각적 높이를 실제 픽셀 높이의 1/3로 축소 (화면 이탈 방지)
        let realPixelHeight = targetHeight * scale;
        visualTargetHeight = realPixelHeight / 3;
        if(visualTargetHeight > 280) visualTargetHeight = 280; // 아무리 높아도 천장을 뚫지 않게 제한

        missionText.innerText = `거리(밑변): ${targetDistance}m | 적의 높이(높이): ${targetHeight}m`;

        drawScene();
        generateTable();
        startTimer();
    }

    // ⏱️ 타이머 로직
    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 5;
        timerText.innerText = `⏳ 남은 시간: ${timeLeft}초`;
        timerText.style.color = "#ff4757";

        timerInterval = setInterval(() => {
            if (isFiring) return; 
            timeLeft--;
            timerText.innerText = `⏳ 남은 시간: ${timeLeft}초`;
            
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                enemyFire(); // 0초가 되면 적군이 공격!
            }
        }, 1000);
    }

    function drawScene() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = '#2f3640';
        ctx.fillRect(0, originY, canvas.width, canvas.height - originY);

        const targetCanvasX = originX + (targetDistance * scale);
        const targetCanvasY = originY - visualTargetHeight; // 축소된 시각적 높이 적용
        
        ctx.fillStyle = '#7f8fa6';
        ctx.fillRect(targetCanvasX - 15, targetCanvasY, 30, originY - targetCanvasY);
        
        ctx.font = "40px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("🤡", targetCanvasX, targetCanvasY - 15);

        ctx.save();
        ctx.translate(originX, originY - 10); 
        ctx.rotate(-45 * Math.PI / 180); 
        
        ctx.fillStyle = '#718093'; 
        ctx.fillRect(0, -12, 55, 24); 
        ctx.fillStyle = '#2f3640'; 
        ctx.fillRect(45, -14, 10, 28);
        ctx.restore(); 

        ctx.fillStyle = '#e1b12c';
        ctx.beginPath();
        ctx.arc(originX, originY - 10, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#2f3640';
        ctx.beginPath();
        ctx.arc(originX, originY - 10, 6, 0, Math.PI * 2);
        ctx.fill();
    }

    function generateTable() {
        tableBody.innerHTML = '';
        const startAngle = targetAngle - 4; 

        for(let a = startAngle; a <= startAngle + 9; a++) {
            const rad = a * Math.PI / 180;
            const tan = Math.tan(rad).toFixed(4);
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>${a}°</b></td>
                <td class="highlight-tan">${tan}</td>
            `;
            tableBody.appendChild(tr);
        }
    }

    // 🚀 아군(플레이어) 발사
    function fireCannon() {
        if(isFiring) return; 
        
        const inputAngle = parseFloat(angleInput.value);
        if(isNaN(inputAngle) || inputAngle <= 0 || inputAngle >= 90) return;

        isFiring = true;
        clearInterval(timerInterval); // 발사 버튼을 누르면 타이머 정지

        let ballX = originX;
        let ballY = originY - 10; 
        const speed = 10; 
        
        // ★ 축소된 몬스터에게 명중하기 위한 "시각적 필요 각도" 자동 계산
        const targetCanvasX = originX + (targetDistance * scale);
        const targetCanvasY = originY - visualTargetHeight - 15;
        const dx = targetCanvasX - originX;
        const dy = (originY - 10) - targetCanvasY;
        const visualCorrectAngle = Math.atan2(dy, dx) * 180 / Math.PI;

        let finalAngleToShoot;
        let isCorrect = (Math.round(inputAngle) === targetAngle);
        
        if (isCorrect) {
            finalAngleToShoot = visualCorrectAngle; // 정답일 때는 시각적으로 완벽히 명중
        } else if (inputAngle > targetAngle) {
            finalAngleToShoot = visualCorrectAngle + 7.5; 
        } else {
            finalAngleToShoot = visualCorrectAngle - 7.5; 
        }

        const rad = finalAngleToShoot * Math.PI / 180;
        const vx = Math.cos(rad) * speed;
        const vy = -Math.sin(rad) * speed; 

        function animate() {
            drawScene(); 
            ctx.fillStyle = '#ff7f50';
            ctx.beginPath();
            ctx.arc(ballX, ballY, 8, 0, Math.PI * 2);
            ctx.fill();

            ballX += vx;
            ballY += vy;

            if (ballX > canvas.width || ballY < 0 || ballY >= originY) {
                if (!isCorrect) {
                    let msg = inputAngle > targetAngle ? "위로 날아갔군요!" : "아래 성벽에 맞았군요!";
                    alert(`앗! 빗나갔습니다. 몬스터 ${msg}\n(입력: ${inputAngle}도 / 정답 아님)`);
                }
                initGame();
                return;
            }
            
            const dist = Math.hypot(ballX - targetCanvasX, ballY - targetCanvasY);
            if (isCorrect && dist < 25) { 
                ctx.font = "50px Arial";
                ctx.fillText("💥", targetCanvasX, targetCanvasY);
                setTimeout(() => {
                    alert(`정확합니다! ${targetAngle}도를 완벽하게 계산하셨군요!`);
                    initGame(); 
                }, 200);
                return; 
            }
            requestAnimationFrame(animate);
        }
        animate();
    }

    // ☠️ 몬스터의 반격 (시간 초과 시)
    function enemyFire() {
        isFiring = true;
        timerText.innerText = "☠️ 몬스터 반격 중!";
        
        let ballX = originX + (targetDistance * scale);
        let ballY = originY - visualTargetHeight - 15;
        
        // 플레이어(대포)를 향하는 각도 계산
        const dx = originX - ballX;
        const dy = (originY - 10) - ballY;
        const angle = Math.atan2(dy, dx);
        
        const speed = 8;
        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed;

        function animateEnemy() {
            drawScene();

            // 적의 포탄 (초록색 독가스)
            ctx.fillStyle = '#2ed573';
            ctx.beginPath();
            ctx.arc(ballX, ballY, 10, 0, Math.PI * 2);
            ctx.fill();

            ballX += vx;
            ballY += vy;

            // 플레이어 대포에 맞았을 때
            const dist = Math.hypot(ballX - originX, ballY - (originY - 10));
            if (dist < 20 || ballX < originX) {
                ctx.font = "60px Arial";
                ctx.fillText("💥", originX, originY - 10);
                setTimeout(() => {
                    alert("앗! 6초가 경과하여 몬스터의 대포에 맞았습니다!\n더 빨리 표에서 정답을 찾아야 합니다!");
                    initGame();
                }, 200);
                return;
            }
            requestAnimationFrame(animateEnemy);
        }
        animateEnemy();
    }

    window.onload = initGame;
</script>
</body>
</html>
