<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>깨진 그릇 복원하기</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #2f3640;
            color: #f5f6fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .back-btn {
            text-decoration: none;
            color: white;
            background: #576574;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
        }
        h2 { color: #fbc531; margin: 0; }
        
        .main-content {
            display: flex;
            gap: 20px;
            max-width: 950px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap; /* 화면 좁으면 아래로 내려감 */
        }

        .guide-panel {
            background: #353b48;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            width: 280px;
            display: flex;
            flex-direction: column;
        }
        .guide-panel h3 {
            margin-top: 0;
            color: #4cd137;
            text-align: center;
            border-bottom: 2px solid #7f8fa6;
            padding-bottom: 10px;
        }
        .step-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 1.1rem;
            color: #7f8fa6;
        }
        .step-list li {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            background: #2f3640;
            transition: 0.3s;
        }
        .step-list li.active {
            color: #2f3640;
            background: #fbc531;
            font-weight: bold;
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(251, 197, 49, 0.4);
        }

        .game-area {
            background: #353b48;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            text-align: center;
            flex: 1;
            min-width: 500px;
        }
        canvas {
            background-color: #222f3e;
            border: 3px solid #7f8fa6;
            border-radius: 10px;
            cursor: crosshair;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px;
        }
        .controls {
            margin-top: 20px;
            height: 50px;
        }
        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: none; 
            transition: 0.2s;
        }
        button:hover { background: #2980b9; transform: scale(1.05); }
        .reset-btn {
            background: #e74c3c;
            display: inline-block;
            margin-left: 10px;
        }
        .reset-btn:hover { background: #c0392b; }
    </style>

    <!-- 🌟 깨진 그릇 복원하기 비밀번호 검사 🌟 -->
    <script>
        if (!sessionStorage.getItem("chordPass")) {
            const pwd = prompt("깨진 그릇 복원하기 게임입니다. 비밀번호를 입력하세요 🔒");
            if (pwd === "5352") {
                sessionStorage.setItem("chordPass", "true");
            } else {
                alert("비밀번호가 틀렸습니다! 메인 화면으로 돌아갑니다. ❌");
                location.href = "index.html"; 
            }
        }
    </script>
</head>
<body>

    <div class="header">
        <a href="circle.html" class="back-btn">⬅ 메뉴로</a>
        <h2>🏺 깨진 그릇 복원하기 (원과 현)</h2>
        <div style="width: 80px;"></div>
    </div>

    <div class="main-content">
        <!-- 네비게이션 가이드 패널 -->
        <div class="guide-panel">
            <h3>📜 발굴 안내서</h3>
            <ul class="step-list">
                <li id="guide-0" class="active">1. 테두리 위에 두 점을 찍어보세요.</li>
                <li id="guide-1">2. 수직이등분선을 그려보세요.</li>
                <li id="guide-2">3. 다른 두 점을 찍어보세요.</li>
                <li id="guide-3">4. 다시 수직이등분선을 그어보세요.</li>
                <li id="guide-4">5. 교점(중심)을 찍어보세요.</li>
            </ul>
        </div>

        <!-- 게임 캔버스 영역 -->
        <div class="game-area">
            <canvas id="gameCanvas" width="600" height="400"></canvas>
            
            <div class="controls">
                <button id="actionBtn" onclick="nextStep()">수직이등분선 그리기 📏</button>
                <button class="reset-btn" style="display:inline-block;" onclick="resetGame()">다시 하기 🔄</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const actionBtn = document.getElementById("actionBtn");

        // 원의 중심과 반지름 설정
        const centerX = 300;
        const centerY = 200;
        const radius = 130;
        
        let startAngle = 0;
        let endAngle = 0;
        let points = []; 
        let step = 0;    
        let animationAngle = 0; 

        // 🌟 1. 도자기 모양 랜덤 생성 함수
        function generateRandomArc() {
            // 호의 길이를 원의 1/3 ~ 2/3 크기로 랜덤하게 설정
            const arcLength = Math.PI * (0.6 + Math.random() * 0.8);
            // 시작 위치를 360도(2PI) 중 아무 곳이나 랜덤 설정
            startAngle = Math.random() * Math.PI * 2;
            endAngle = startAngle + arcLength;
            animationAngle = endAngle;
        }

        // 가이드 강조 함수
        function updateGuide(currentStep) {
            for (let i = 0; i <= 4; i++) {
                document.getElementById(`guide-${i}`).classList.remove("active");
            }
            if (currentStep <= 4) {
                document.getElementById(`guide-${currentStep}`).classList.add("active");
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 깨진 그릇 그리기
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, startAngle, animationAngle);
            ctx.lineWidth = 6;
            ctx.strokeStyle = "#e67e22";
            ctx.stroke();

            if (step === 5) {
                ctx.fillStyle = "rgba(230, 126, 34, 0.2)";
                ctx.fill();
            }

            // 찍은 점 그리기
            ctx.fillStyle = "#f1c40f";
            points.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            });

            if (points.length >= 2) drawLine(points[0], points[1], "#34dbeb", 3);
            if (step >= 2) drawPerpendicularBisector(points[0], points[1]);
            if (points.length >= 4) drawLine(points[2], points[3], "#9b59b6", 3);
            if (step >= 4) drawPerpendicularBisector(points[2], points[3]);

            if (step === 5) {
                ctx.fillStyle = "#ffdd59";
                ctx.font = "30px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("⭐", centerX, centerY);
            }
        }

        function drawLine(p1, p2, color, width) {
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.setLineDash([]);
            ctx.stroke();
        }

        function drawPerpendicularBisector(p1, p2) {
            const midX = (p1.x + p2.x) / 2;
            const midY = (p1.y + p2.y) / 2;
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const len = Math.sqrt(dx*dx + dy*dy);
            const px = (-dy / len) * 300; 
            const py = (dx / len) * 300;

            ctx.beginPath();
            ctx.moveTo(midX - px, midY - py);
            ctx.lineTo(midX + px, midY + py);
            ctx.strokeStyle = "#e74c3c";
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]); 
            ctx.stroke();
            ctx.setLineDash([]); 
        }

        // 클릭 이벤트 (점 찍기 제어)
        canvas.addEventListener("mousedown", function(e) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (step === 4) {
                const distToCenter = Math.sqrt((mouseX - centerX)**2 + (mouseY - centerY)**2);
                if (distToCenter < 20) { 
                    step = 5;
                    updateGuide(5); // 가이드 끝
                    document.getElementById("guide-4").innerHTML = "🎉 정답! 그릇이 복원됩니다.";
                    animateRestore(); 
                } else {
                    alert("❌ 거기가 아니에요! 두 점선이 만나는 십자가 교차점을 정확히 클릭하세요.");
                }
                return;
            }

            // 🌟 점 개수 엄격하게 제한 (2개 이상, 4개 이상 안 찍히도록 방어)
            if (step === 0 && points.length >= 2) return;
            if (step === 2 && points.length >= 4) return;

            if (step === 0 || step === 2) {
                const dist = Math.sqrt((mouseX - centerX)**2 + (mouseY - centerY)**2);
                let clickAngle = Math.atan2(mouseY - centerY, mouseX - centerX);
                
                // 클릭한 각도가 렌더링된 호 안에 있는지 수학적 검사
                while (clickAngle < startAngle) clickAngle += Math.PI * 2;
                while (clickAngle >= startAngle + Math.PI * 2) clickAngle -= Math.PI * 2;

                if (Math.abs(dist - radius) < 15 && clickAngle <= endAngle) { 
                    points.push({
                        x: centerX + radius * Math.cos(clickAngle),
                        y: centerY + radius * Math.sin(clickAngle)
                    });
                    
                    draw();

                    // 버튼 활성화 및 단계 변경
                    if (points.length === 2 && step === 0) {
                        step = 1;
                        updateGuide(1);
                        actionBtn.style.display = "inline-block";
                    }
                    else if (points.length === 4 && step === 2) {
                        step = 3;
                        updateGuide(3);
                        actionBtn.style.display = "inline-block";
                    }
                } else {
                    alert("⚠️ 눈에 보이는 주황색 그릇 테두리 위에 점을 찍어주세요!");
                }
            }
        });

        function nextStep() {
            if (step === 1) {
                step = 2; // 두 번째 점 찍기 활성화
                updateGuide(2);
                actionBtn.style.display = "none";
                draw();
            } 
            else if (step === 3) {
                step = 4; // 중심 클릭 활성화
                updateGuide(4);
                actionBtn.style.display = "none";
                draw();
            }
        }

        function animateRestore() {
            if (animationAngle < startAngle + Math.PI * 2) {
                animationAngle += 0.05; 
                draw();
                requestAnimationFrame(animateRestore);
            }
        }

        function resetGame() {
            points = [];
            step = 0;
            actionBtn.style.display = "none";
            document.getElementById("guide-4").innerHTML = "5. 교점(중심)을 찍어보세요.";
            updateGuide(0);
            generateRandomArc();
            draw();
        }

        // 초기 시작
        resetGame();
    </script>
</body>
</html>
