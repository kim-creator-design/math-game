<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>깨진 그릇 복원하기</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #2f3640;
            color: #f5f6fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .back-btn {
            text-decoration: none;
            color: white;
            background: #576574;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
        }
        h2 { color: #fbc531; margin: 0; }
        
        .main-content {
            display: flex;
            gap: 20px;
            max-width: 950px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .guide-panel {
            background: #353b48;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            width: 280px;
            display: flex;
            flex-direction: column;
        }
        .guide-panel h3 {
            margin-top: 0;
            color: #4cd137;
            text-align: center;
            border-bottom: 2px solid #7f8fa6;
            padding-bottom: 10px;
        }
        .step-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 1.1rem;
            color: #7f8fa6;
        }
        .step-list li {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            background: #2f3640;
            transition: 0.3s;
        }
        .step-list li.active {
            color: #2f3640;
            background: #fbc531;
            font-weight: bold;
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(251, 197, 49, 0.4);
        }

        .game-area {
            background: #353b48;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            text-align: center;
            flex: 1;
            min-width: 500px;
        }
        canvas {
            background-color: #222f3e;
            border: 3px solid #7f8fa6;
            border-radius: 10px;
            cursor: crosshair;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px;
        }
        .controls {
            margin-top: 20px;
            height: 50px;
        }
        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: none; 
            transition: 0.2s;
        }
        button:hover { background: #2980b9; transform: scale(1.05); }
        .reset-btn {
            background: #e74c3c;
            display: inline-block;
            margin-left: 10px;
        }
        .reset-btn:hover { background: #c0392b; }
    </style>

    <script>
        if (!sessionStorage.getItem("chordPass")) {
            const pwd = prompt("깨진 그릇 복원하기 게임입니다. 비밀번호를 입력하세요 🔒");
            if (pwd === "5352") {
                sessionStorage.setItem("chordPass", "true");
            } else {
                alert("비밀번호가 틀렸습니다! 메인 화면으로 돌아갑니다. ❌");
                location.href = "index.html"; 
            }
        }
    </script>
</head>
<body>

    <div class="header">
        <a href="circle.html" class="back-btn">⬅ 메뉴로</a>
        <h2>🏺 깨진 그릇 복원하기 (원과 현)</h2>
        <div style="width: 80px;"></div>
    </div>

    <div class="main-content">
        <div class="guide-panel">
            <h3>📜 발굴 안내서</h3>
            <ul class="step-list">
                <li id="guide-0" class="active">1. 온전한 테두리 위에 두 점을 찍어보세요.</li>
                <li id="guide-1">2. 수직이등분선을 그려보세요.</li>
                <li id="guide-2">3. 다른 두 점을 찍어보세요.</li>
                <li id="guide-3">4. 다시 수직이등분선을 그어보세요.</li>
                <li id="guide-4">5. 두 선의 교점(중심)을 찍어보세요.</li>
            </ul>
        </div>

        <div class="game-area">
            <canvas id="gameCanvas" width="600" height="400"></canvas>
            
            <div class="controls">
                <button id="actionBtn" onclick="nextStep()">수직이등분선 그리기 📏</button>
                <button class="reset-btn" style="display:inline-block;" onclick="resetGame()">다른 조각 발굴 🔄</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const actionBtn = document.getElementById("actionBtn");

        const centerX = 300;
        const centerY = 200;
        const radius = 130;
        
        let startAngle = 0;
        let endAngle = 0;
        let points = []; 
        let step = 0;    
        let animationProgress = 0; 

        // 도자기 파편 데이터를 담을 배열
        let shardPath = [];
        let bowlColor = "";
        let bowlDarkColor = "";

        const potteryStyles = [
            { light: "#d35400", dark: "#a04000" }, // 토기 (갈색)
            { light: "#16a085", dark: "#0e6655" }, // 고려청자 (옥색)
            { light: "#ecf0f1", dark: "#bdc3c7" }  // 조선백자 (회백색)
        ];

        function generateRandomArc() {
            const style = potteryStyles[Math.floor(Math.random() * potteryStyles.length)];
            bowlColor = style.light;
            bowlDarkColor = style.dark;

            const arcLength = Math.PI * (0.5 + Math.random() * 0.7); // 반원 조금 넘거나 모자라게
            startAngle = Math.random() * Math.PI * 2;
            endAngle = startAngle + arcLength;
            
            shardPath = [];
            // 1. 매끈한 바깥쪽 테두리 (정확한 원)
            for(let a = startAngle; a <= endAngle; a += 0.05) {
                shardPath.push({ x: centerX + radius * Math.cos(a), y: centerY + radius * Math.sin(a) });
            }
            
            // 2. 삐뚤빼뚤한 안쪽 깨진 단면 생성
            for(let a = endAngle; a >= startAngle; a -= 0.1) {
                // 두께를 불규칙하게 (30px ~ 70px)
                const innerRadius = radius - 30 - Math.random() * 40; 
                shardPath.push({ x: centerX + innerRadius * Math.cos(a), y: centerY + innerRadius * Math.sin(a) });
            }
        }

        function updateGuide(currentStep) {
            for (let i = 0; i <= 4; i++) {
                document.getElementById(`guide-${i}`).classList.remove("active");
            }
            if (currentStep <= 4) {
                document.getElementById(`guide-${currentStep}`).classList.add("active");
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 🌟 리얼한 깨진 도자기 조각 그리기
            ctx.beginPath();
            if (shardPath.length > 0) {
                ctx.moveTo(shardPath[0].x, shardPath[0].y);
                for(let i = 1; i < shardPath.length; i++) {
                    ctx.lineTo(shardPath[i].x, shardPath[i].y);
                }
                ctx.closePath();
                
                ctx.fillStyle = bowlColor;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = bowlDarkColor;
                ctx.stroke();

                // 바깥쪽 온전한 테두리(점 찍을 곳)만 눈에 띄게 한 번 더 선을 그어줌
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.lineWidth = 5;
                ctx.strokeStyle = "#fbc531"; // 노란색으로 가이드라인
                ctx.stroke();
            }

            // 정답 맞힌 후 복원 애니메이션 (투명한 원이 채워짐)
            if (step === 5) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2 * animationProgress);
                ctx.fillStyle = bowlColor + "80"; // 반투명
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = bowlDarkColor;
                ctx.stroke();
            }

            // 찍은 점 그리기
            ctx.fillStyle = "#ff4757";
            points.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            });

            if (points.length >= 2) drawLine(points[0], points[1], "#34dbeb", 3);
            if (step >= 2) drawPerpendicularBisector(points[0], points[1]);
            if (points.length >= 4) drawLine(points[2], points[3], "#9b59b6", 3);
            if (step >= 4) drawPerpendicularBisector(points[2], points[3]);

            if (step === 5) {
                ctx.fillStyle = "#ffdd59";
                ctx.font = "40px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("⭐", centerX, centerY);
            }
        }

        function drawLine(p1, p2, color, width) {
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.setLineDash([]);
            ctx.stroke();
        }

        function drawPerpendicularBisector(p1, p2) {
            const midX = (p1.x + p2.x) / 2;
            const midY = (p1.y + p2.y) / 2;
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const len = Math.sqrt(dx*dx + dy*dy);
            const px = (-dy / len) * 300; 
            const py = (dx / len) * 300;

            ctx.beginPath();
            ctx.moveTo(midX - px, midY - py);
            ctx.lineTo(midX + px, midY + py);
            ctx.strokeStyle = "#e74c3c";
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 8]); 
            ctx.stroke();
            ctx.setLineDash([]); 
        }

        canvas.addEventListener("mousedown", function(e) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (step === 4) {
                const distToCenter = Math.sqrt((mouseX - centerX)**2 + (mouseY - centerY)**2);
                if (distToCenter < 25) { // 교차점 판정 약간 후하게
                    step = 5;
                    updateGuide(5); 
                    document.getElementById("guide-4").innerHTML = "🎉 정답! 유물이 완벽하게 복원되었습니다.";
                    animateRestore(); 
                } else {
                    alert("❌ 거기가 아니에요! 두 점선이 만나는 십자가 교차점을 정확히 클릭하세요.");
                }
                return;
            }

            if (step === 0 && points.length >= 2) return;
            if (step === 2 && points.length >= 4) return;

            if (step === 0 || step === 2) {
                const dist = Math.sqrt((mouseX - centerX)**2 + (mouseY - centerY)**2);
                
                // 🌟 클릭 판정 로직 완벽 수정!
                let clickAngle = Math.atan2(mouseY - centerY, mouseX - centerX);
                if (clickAngle < 0) clickAngle += 2 * Math.PI; // 각도를 무조건 0 ~ 360도로 변환

                let s = startAngle % (2 * Math.PI);
                let e = endAngle % (2 * Math.PI);

                let angleValid = false;
                if (s < e) {
                    angleValid = (clickAngle >= s && clickAngle <= e);
                } else {
                    angleValid = (clickAngle >= s || clickAngle <= e);
                }

                // 오차 허용 범위를 25px로 넓혀서 아주 쉽게 찍히게 함
                if (Math.abs(dist - radius) < 25 && angleValid) { 
                    points.push({
                        x: centerX + radius * Math.cos(clickAngle),
                        y: centerY + radius * Math.sin(clickAngle)
                    });
                    
                    draw();

                    if (points.length === 2 && step === 0) {
                        step = 1;
                        updateGuide(1);
                        actionBtn.style.display = "inline-block";
                    }
                    else if (points.length === 4 && step === 2) {
                        step = 3;
                        updateGuide(3);
                        actionBtn.style.display = "inline-block";
                    }
                } else {
                    alert("⚠️ 노란색으로 칠해진 매끈한 바깥쪽 테두리 위에 점을 찍어주세요!");
                }
            }
        });

        function nextStep() {
            if (step === 1) {
                step = 2; 
                updateGuide(2);
                actionBtn.style.display = "none";
                draw();
            } 
            else if (step === 3) {
                step = 4; 
                updateGuide(4);
                actionBtn.style.display = "none";
                draw();
            }
        }

        function animateRestore() {
            if (animationProgress < 1) {
                animationProgress += 0.02; 
                draw();
                requestAnimationFrame(animateRestore);
            }
        }

        function resetGame() {
            points = [];
            step = 0;
            animationProgress = 0;
            actionBtn.style.display = "none";
            document.getElementById("guide-4").innerHTML = "5. 두 선의 교점(중심)을 찍어보세요.";
            updateGuide(0);
            generateRandomArc();
            draw();
        }

        resetGame();
    </script>
</body>
</html>
