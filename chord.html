<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>깨진 그릇 복원하기</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #2f3640;
            color: #f5f6fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .back-btn {
            text-decoration: none;
            color: white;
            background: #576574;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
        }
        h2 { color: #fbc531; margin: 0; }
        
        .game-area {
            background: #353b48;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            text-align: center;
        }
        #instruction {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #4cd137;
            font-weight: bold;
            height: 30px;
        }
        canvas {
            background-color: #222f3e;
            border: 3px solid #7f8fa6;
            border-radius: 10px;
            cursor: crosshair;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .controls {
            margin-top: 20px;
            height: 50px;
        }
        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: none; /* 처음엔 숨김 */
            transition: 0.2s;
        }
        button:hover { background: #2980b9; transform: scale(1.05); }
        .reset-btn {
            background: #e74c3c;
            display: inline-block;
            margin-left: 10px;
        }
        .reset-btn:hover { background: #c0392b; }
    </style>

<script>
        if (!sessionStorage.getItem("chordPass")) {
            const pwd = prompt("깨진 그릇 복원하기 게임입니다. 비밀번호를 입력하세요 🔒");
            if (pwd === "5352") {
                sessionStorage.setItem("chordPass", "true");
            } else {
                alert("비밀번호가 틀렸습니다! 메인 화면으로 돌아갑니다. ❌");
                location.href = "index.html"; 
            }
        }
    </script>

</head>
<body>

    <div class="header">
        <a href="circle.html" class="back-btn">⬅ 메뉴로</a>
        <h2>🏺 깨진 그릇 복원하기 (원과 현)</h2>
        <div style="width: 80px;"></div> <!-- 중앙 정렬용 빈 공간 -->
    </div>

    <div class="game-area">
        <div id="instruction">미션: 깨진 그릇의 테두리(호) 위에 점 2개를 클릭하세요! (1번째 현)</div>
        
        <!-- 게임 캔버스 -->
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        
        <div class="controls">
            <button id="actionBtn" onclick="nextStep()">수직이등분선 긋기 📏</button>
            <button class="reset-btn" style="display:inline-block;" onclick="resetGame()">다시 하기 🔄</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const instruction = document.getElementById("instruction");
        const actionBtn = document.getElementById("actionBtn");

        // 그릇(원)의 진짜 중심과 반지름 (비밀 정답)
        const centerX = 300;
        const centerY = 200;
        const radius = 130;
        
        // 깨진 그릇(호)이 그려질 각도 범위 (아래쪽 절반 정도)
        const startAngle = 0.1 * Math.PI;
        const endAngle = 0.9 * Math.PI;

        let points = []; // 사용자가 찍은 점들 저장
        let step = 0;    // 게임 진행 단계
        let animationAngle = endAngle; // 복원 애니메이션용 각도

        // 화면 그리기 함수
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 깨진 그릇 그리기 (주황색 테두리)
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, startAngle, animationAngle);
            ctx.lineWidth = 6;
            ctx.strokeStyle = "#e67e22";
            ctx.stroke();

            // 만약 애니메이션 중이라 원이 완성되었다면 옅은 색으로 안쪽 채우기
            if (step === 5) {
                ctx.fillStyle = "rgba(230, 126, 34, 0.2)";
                ctx.fill();
            }

            // 2. 사용자가 찍은 점 그리기
            ctx.fillStyle = "#f1c40f";
            points.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            });

            // 3. 첫 번째 현 그리기
            if (points.length >= 2) {
                drawLine(points[0], points[1], "#34dbeb", 3);
            }
            
            // 4. 첫 번째 수직이등분선 그리기 (step 1 이상)
            if (step >= 1) {
                drawPerpendicularBisector(points[0], points[1]);
            }

            // 5. 두 번째 현 그리기
            if (points.length >= 4) {
                drawLine(points[2], points[3], "#9b59b6", 3);
            }

            // 6. 두 번째 수직이등분선 그리기 (step 3 이상)
            if (step >= 3) {
                drawPerpendicularBisector(points[2], points[3]);
            }

            // 7. 정답 맞췄을 때 진짜 중심에 별 표시
            if (step === 5) {
                ctx.fillStyle = "#ffdd59";
                ctx.font = "30px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("⭐", centerX, centerY);
            }
        }

        // 선 긋기 헬퍼 함수
        function drawLine(p1, p2, color, width) {
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.setLineDash([]);
            ctx.stroke();
        }

        // 수직이등분선 긋기 함수 (수학적 원리 적용!)
        function drawPerpendicularBisector(p1, p2) {
            const midX = (p1.x + p2.x) / 2;
            const midY = (p1.y + p2.y) / 2;
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            
            // 수직 방향 벡터 (-dy, dx)
            const len = Math.sqrt(dx*dx + dy*dy);
            const px = (-dy / len) * 300; 
            const py = (dx / len) * 300;

            ctx.beginPath();
            ctx.moveTo(midX - px, midY - py);
            ctx.lineTo(midX + px, midY + py);
            ctx.strokeStyle = "#e74c3c";
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]); // 점선
            ctx.stroke();
            ctx.setLineDash([]); // 원래대로
        }

        // 캔버스 클릭 이벤트 (점 찍기 & 중심 찾기)
        canvas.addEventListener("mousedown", function(e) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // 단계 4: 교차점(원의 중심) 찾기
            if (step === 4) {
                const distToCenter = Math.sqrt((mouseX - centerX)**2 + (mouseY - centerY)**2);
                if (distToCenter < 20) { // 중심점 오차 허용 범위(20px)
                    instruction.innerHTML = "🎉 정답입니다! 현의 수직이등분선은 항상 원의 중심을 지납니다!";
                    instruction.style.color = "#ffdd59";
                    step = 5;
                    animateRestore(); // 복원 애니메이션 시작!
                } else {
                    instruction.innerHTML = "❌ 거기가 아니에요! 두 점선(수직이등분선)이 교차하는 점을 정확히 누르세요.";
                    instruction.style.color = "#ff4757";
                }
                return;
            }

            // 점 찍기 단계 (step 0: 첫 번째 현, step 2: 두 번째 현)
            if (step === 0 || step === 2) {
                // 클릭한 곳이 깨진 호(테두리) 근처인지 수학적으로 계산!
                const dist = Math.sqrt((mouseX - centerX)**2 + (mouseY - centerY)**2);
                
                if (Math.abs(dist - radius) < 15) { // 15px 오차 허용
                    // 테두리에 정확히 딱 맞게(스냅) 점 좌표 보정
                    const angle = Math.atan2(mouseY - centerY, mouseX - centerX);
                    points.push({
                        x: centerX + radius * Math.cos(angle),
                        y: centerY + radius * Math.sin(angle)
                    });
                    
                    draw();

                    // 점 2개 찍으면 첫 번째 버튼 활성화
                    if (points.length === 2 && step === 0) {
                        instruction.innerHTML = "현이 만들어졌습니다! 아래 [수직이등분선 긋기] 버튼을 누르세요.";
                        actionBtn.style.display = "inline-block";
                    }
                    // 점 4개 찍으면 두 번째 버튼 활성화
                    else if (points.length === 4 && step === 2) {
                        instruction.innerHTML = "두 번째 현이 완성되었습니다! [수직이등분선 긋기] 버튼을 누르세요.";
                        actionBtn.style.display = "inline-block";
                    }
                } else {
                    instruction.innerHTML = "⚠️ 그릇의 주황색 테두리 위에 점을 찍어주세요!";
                    instruction.style.color = "#ff4757";
                    setTimeout(() => { instruction.style.color = "#4cd137"; }, 1500);
                }
            }
        });

        // 수직이등분선 버튼 클릭 시
        function nextStep() {
            if (step === 0) {
                step = 1;
                instruction.innerHTML = "첫 번째 수직이등분선을 그었습니다! 다른 곳에 점 2개를 더 찍어주세요.";
                actionBtn.style.display = "none";
                draw();
                // 1초 뒤 step 2로 넘어가서 점 찍을 수 있게 대기
                setTimeout(() => { step = 2; }, 100); 
            } 
            else if (step === 2) {
                step = 3;
                draw();
                actionBtn.style.display = "none";
                instruction.innerHTML = "두 점선이 만나는 교차점(X)을 찾아 마우스로 클릭해보세요!";
                setTimeout(() => { step = 4; }, 100);
            }
        }

        // 도자기 복원 애니메이션 (원이 360도 완성됨)
        function animateRestore() {
            if (animationAngle < startAngle + Math.PI * 2) {
                animationAngle += 0.05; // 그리는 속도
                draw();
                requestAnimationFrame(animateRestore);
            }
        }

        // 게임 초기화
        function resetGame() {
            points = [];
            step = 0;
            animationAngle = endAngle;
            actionBtn.style.display = "none";
            instruction.innerHTML = "미션: 깨진 그릇의 테두리(호) 위에 점 2개를 클릭하세요! (1번째 현)";
            instruction.style.color = "#4cd137";
            draw();
        }

        // 처음 화면 로딩 시 그려두기
        draw();
    </script>
</body>
</html>
