<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼각비 대포 게임</title>
<style>
    /* 전체 레이아웃 및 디자인 */
    body { 
        display: flex; 
        font-family: 'Malgun Gothic', sans-serif; 
        background-color: #2f3640; 
        color: #f5f6fa; 
        margin: 0; 
        padding: 30px; 
        justify-content: center;
        gap: 30px;
    }
    h2 { margin-top: 0; color: #fbc531; }
    
    /* 게임 화면 영역 */
    #game-wrapper {
        background: #353b48;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }
    canvas { 
        background: linear-gradient(to bottom, #87CEEB, #e1f5fe); 
        border-radius: 8px; 
        border: 2px solid #7f8fa6;
    }
    
    /* 조작부 영역 */
    #controls { 
        margin-top: 20px; 
        padding: 15px;
        background: #2f3640;
        border-radius: 8px;
        text-align: center;
    }
    .mission-text { font-size: 1.1em; margin-bottom: 15px; color: #00a8ff; font-weight: bold; }
    input[type="number"] { 
        padding: 10px; 
        width: 80px; 
        font-size: 18px; 
        border-radius: 6px;
        border: none;
        text-align: center;
    }
    button { 
        padding: 10px 24px; 
        font-size: 18px; 
        cursor: pointer; 
        background: #e84118; 
        color: white; 
        border: none; 
        border-radius: 6px; 
        font-weight: bold;
        transition: background 0.3s;
    }
    button:hover { background: #c23616; }

    /* 삼각비 표 영역 */
    #sidebar { 
        background: #353b48; 
        padding: 20px; 
        border-radius: 12px; 
        box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        min-width: 250px;
    }
    table { 
        border-collapse: collapse; 
        width: 100%; 
        text-align: center; 
        background: #f5f6fa;
        color: #2f3640;
        border-radius: 8px;
        overflow: hidden;
    }
    th, td { border: 1px solid #dcdde1; padding: 12px; }
    th { background: #718093; color: white; }
    .highlight-tan { background-color: #fbc531; font-weight: bold; }
</style>
</head>
<body>

    <!-- 왼쪽: 게임 화면 및 조작부 -->
    <div id="game-wrapper">
        <h2>🏰 성벽 방어: 적을 명중시켜라!</h2>
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        
        <div id="controls">
            <div class="mission-text" id="mission-text">
                거리(밑변): 100m | 적의 높이(높이): ?m
            </div>
            <label>대포 각도: </label>
            <input type="number" id="angle-input" placeholder="0~90"> 도 
            <button onclick="fireCannon()">🚀 발사!</button>
        </div>
    </div>

    <!-- 오른쪽: 삼각비 표 (힌트) -->
    <div id="sidebar">
        <h3 style="color: #4cd137;">📝 삼각비 표 (힌트)</h3>
        <p style="font-size: 0.9em; color:#7f8fa6;">※ tan(각도) = 높이 / 밑변</p>
        <table id="trig-table">
            <thead>
                <tr>
                    <th>각도</th>
                    <th>sin</th>
                    <th>cos</th>
                    <th>tan</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- 자바스크립트로 값이 들어갑니다 -->
            </tbody>
        </table>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const tableBody = document.getElementById('table-body');
    const missionText = document.getElementById('mission-text');
    const angleInput = document.getElementById('angle-input');

    let targetAngle = 0;
    let targetDistance = 100; // 계산하기 쉽게 거리는 100으로 고정
    let targetHeight = 0;
    let isFiring = false;

    // 캔버스 그리기 기준점 (대포의 위치)
    const originX = 50;
    const originY = 350;
    const scale = 4; // 화면에 그릴 때 1m를 4픽셀로 뻥튀기

    // 1. 게임 초기화 및 문제 출제
    function initGame() {
        isFiring = false;
        angleInput.value = '';
        
        // 31도 ~ 40도 사이의 랜덤 각도 생성 (특수각을 피함)
        targetAngle = Math.floor(Math.random() * 10) + 31;
        
        // 정답 높이 계산: 높이 = 밑변 * tan(각도)
        const tanValue = Math.tan(targetAngle * Math.PI / 180);
        targetHeight = (targetDistance * tanValue).toFixed(4); 

        // 문제 텍스트 업데이트
        missionText.innerText = `적까지의 거리(밑변): ${targetDistance}m | 적의 높이(높이): ${targetHeight}m`;

        drawScene();
        generateTable();
    }

    // 2. 화면 그리기 (배경, 대포, 타겟)
    function drawScene() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 바닥 그리기
        ctx.fillStyle = '#44bd32';
        ctx.fillRect(0, originY, canvas.width, canvas.height - originY);

        // 대포 본체 그리기
        ctx.fillStyle = '#2d3436';
        ctx.beginPath();
        ctx.arc(originX, originY, 25, Math.PI, 0); // 반원
        ctx.fill();

        // 적과 기둥 그리기
        const targetCanvasX = originX + (targetDistance * scale);
        const targetCanvasY = originY - (targetHeight * scale); // 캔버스는 위로 갈수록 y좌표가 작아짐
        
        // 타워 기둥
        ctx.fillStyle = '#718093';
        ctx.fillRect(targetCanvasX - 10, targetCanvasY, 20, originY - targetCanvasY);
        
        // 적(빨간 슬라임 느낌)
        ctx.fillStyle = '#c23616';
        ctx.beginPath();
        ctx.arc(targetCanvasX, targetCanvasY, 15, 0, Math.PI * 2);
        ctx.fill();
    }

    // 3. 삼각비 표 생성 (정답 근처의 각도 5개 보여주기)
    function generateTable() {
        tableBody.innerHTML = '';
        const startAngle = targetAngle - 2; // 정답보다 2도 낮은 것부터 시작

        for(let a = startAngle; a <= startAngle + 4; a++) {
            const rad = a * Math.PI / 180;
            const sin = Math.sin(rad).toFixed(4);
            const cos = Math.cos(rad).toFixed(4);
            const tan = Math.tan(rad).toFixed(4);
            
            const tr = document.createElement('tr');
            // 학생이 tan 값에 집중하도록 클래스 추가
            tr.innerHTML = `
                <td><b>${a}°</b></td>
                <td>${sin}</td>
                <td>${cos}</td>
                <td class="highlight-tan">${tan}</td>
            `;
            tableBody.appendChild(tr);
        }
    }

    // 4. 대포 발사 및 애니메이션 로직
    function fireCannon() {
        if(isFiring) return; // 이미 발사 중이면 무시
        
        const inputAngle = parseFloat(angleInput.value);
        if(isNaN(inputAngle) || inputAngle <= 0 || inputAngle >= 90) {
            alert("0에서 90 사이의 각도를 정확히 입력해주세요!");
            return;
        }

        isFiring = true;
        let ballX = originX;
        let ballY = originY - 20; // 대포 포신 끝부분 높이
        
        const speed = 8; // 포탄 속도 (직선 빔 형태)
        const rad = inputAngle * Math.PI / 180;
        const vx = Math.cos(rad) * speed;
        const vy = -Math.sin(rad) * speed; // y좌표는 위로 갈수록 마이너스

        function animate() {
            drawScene(); // 배경 초기화
            
            // 날아가는 포탄(빛나는 에너지볼 느낌) 그리기
            ctx.fillStyle = '#fbc531';
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'yellow';
            ctx.beginPath();
            ctx.arc(ballX, ballY, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0; // 초기화

            ballX += vx;
            ballY += vy;

            // 1. 화면 밖으로 나갔을 때 (실패)
            if (ballX > canvas.width || ballY < 0 || ballY > canvas.height) {
                alert("앗! 빗나갔습니다. 밑변과 높이의 비율(탄젠트)을 표에서 다시 확인해 보세요!");
                isFiring = false;
                drawScene();
                return;
            }

            // 2. 적에게 명중했는지 충돌 판정
            const targetCanvasX = originX + (targetDistance * scale);
            const targetCanvasY = originY - (targetHeight * scale);
            
            // 두 점 사이의 거리 공식 (피타고라스)
            const dist = Math.hypot(ballX - targetCanvasX, ballY - targetCanvasY);
            if (dist < 20) { // 적 반경 안에 들어오면 명중
                setTimeout(() => {
                    alert(`정확합니다! ${targetAngle}도를 완벽하게 계산하셨군요! 다음 몬스터를 막아주세요!`);
                    initGame(); // 다음 스테이지 준비
                }, 100);
                return;
            }

            // 애니메이션 반복
            requestAnimationFrame(animate);
        }
        
        animate();
    }

    // 게임 시작 시 초기화 함수 실행
    window.onload = initGame;
</script>
</body>
</html>
