<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, maximum-scale=1.0, user-scalable=no">
<title>60초 원주각 슛돌이</title>
<style>
    body { font-family: 'Malgun Gothic', sans-serif; background-color: #2f3640; color: white; text-align: center; margin: 0; padding: 10px; touch-action: none; }
    .container { max-width: 800px; margin: 0 auto; background: #353b48; padding: 20px; border-radius: 15px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); }
    h1 { color: #fbc531; margin-top: 0; font-size: 28px; }
    
    #gameArea { position: relative; display: inline-block; margin-top: 10px; }
    canvas { background: #4cd137; border-radius: 10px; border: 4px solid #dcdde1; box-shadow: inset 0 0 50px rgba(0,0,0,0.2); cursor: pointer; }
    #shotEffect { position:absolute; left:50%; top:48%; transform:translate(-50%,-50%) scale(0.8); font-size:56px; font-weight:900; letter-spacing:-1px; opacity:0; pointer-events:none; z-index:12; text-shadow:0 3px 10px rgba(0,0,0,0.28); transition:opacity 0.18s ease, transform 0.18s ease; }
    
    .menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(47, 54, 64, 0.9); border-radius: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
    
    .btn { padding: 15px 30px; font-size: 20px; margin: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; width: 250px; }
    .btn:hover { transform: scale(1.05); }
    .btn-easy { background: #27ae60; }
    .btn-normal { background: #f39c12; }
    .btn-hard { background: #e74c3c; }
    .btn-play { background: #3498db; margin-top: 16px; }
    .btn-selected { outline: 4px solid #fbc531; transform: scale(1.04); box-shadow: 0 0 14px rgba(251,197,49,0.65); }
    .intro-box { width: 82%; max-width: 500px; background: rgba(255,255,255,0.08); border-radius: 12px; padding: 14px 18px; margin-bottom: 8px; line-height: 1.65; }
    .shot-goal { color:#ffe66d; }
    .shot-save { color:#8fd3ff; }
    .record-box { color: #fbc531; font-weight: bold; margin: 8px 0 2px; font-size: 17px; }
    
    #hud { display: flex; justify-content: space-between; font-size: 22px; font-weight: bold; margin-bottom: 10px; padding: 0 20px; color: #fbc531; }
    #msgBox { min-height: 30px; font-size: 18px; font-weight: bold; color: #fff; margin-top: 15px; }
    .back-btn { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #7f8fa6; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; }
</style>

<script>
    // 🔒 비밀번호: 8541
    (async function checkAuth() {
        if (!sessionStorage.getItem("shootUnlocked")) {
            const pwd = prompt("원주각 슛돌이 비밀번호를 입력하세요 🔒");
            if (pwd) {
                const buffer = new TextEncoder().encode(pwd);
                const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
                const hashHex = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
                
                const targetStr = String.fromCharCode(56, 53, 52, 49); 
                const targetBuffer = new TextEncoder().encode(targetStr);
                const targetHashBuffer = await crypto.subtle.digest('SHA-256', targetBuffer);
                const targetHashHex = Array.from(new Uint8Array(targetHashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');

                if (hashHex === targetHashHex) {
                    sessionStorage.setItem("shootUnlocked", "true");
                    location.reload(); 
                    return;
                }
            }
            alert("비밀번호가 틀렸습니다! ❌");
            location.href = "circle.html"; 
        }
    })();
</script>
</head>
<body>
    <div class="container">
        <h1>⚽ 60초 원주각 슛돌이 ⚽</h1>
        
        <div id="hud">
            <div id="scoreDisplay">누적: 0 골</div>
            <div id="timeDisplay">남은 시간: 60초</div>
        </div>

        <div id="gameArea">
            <canvas id="gameCanvas" width="600" height="550"></canvas>
            
            <div id="menuScreen" class="menu">
                <h2 style="color: #fbc531; margin: 0 0 10px;">⚽ 원주각 슛돌이</h2>
                <div class="intro-box">
                    <strong>게임 방법</strong><br>
                    ① 움직이는 선수를 원하는 위치에서 누르면 멈춥니다.<br>
                    ② 누르고 있는 동안 슛 파워가 변합니다.<br>
                    ③ 손을 떼면 슈팅! 60초 동안 최대한 많은 골을 넣으세요.
                    <div style="color:#f1c40f; margin-top:6px;">💡 같은 현을 보는 원주각의 크기는 같다는 성질을 활용해 보세요!</div>
                </div>
                <div id="bestRecordDisplay" class="record-box">🏆 최고 기록 불러오는 중...</div>
                <h3 style="margin: 10px 0 2px;">난이도 선택</h3>
                <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:4px;">
                    <button id="diffEasyBtn" class="btn btn-easy" onclick="selectDifficulty('easy')">초급 (안 움직이는 키퍼)</button>
                    <button id="diffNormalBtn" class="btn btn-normal" onclick="selectDifficulty('normal')">중급 (좌우로 움직이는 키퍼)</button>
                    <button id="diffHardBtn" class="btn btn-hard" onclick="selectDifficulty('hard')">고급 (빠르고 현란한 키퍼)</button>
                </div>
                <button class="btn btn-play" onclick="startSelectedGame()">▶ 플레이</button>
            </div>
            
            <div id="shotEffect"></div>

            <div id="resultScreen" class="menu" style="display: none;">
                <h2 style="color: #fbc531; font-size: 40px;">경기 종료!</h2>
                <h3 id="finalScore" style="font-size: 30px;">총 0골 달성</h3>
                <div id="resultBestRecord" class="record-box"></div>
                <button class="btn btn-easy" onclick="showMenu()">다시 하기 🔄</button>
            </div>
        </div>
        
        <div id="msgBox">화면을 꾹 눌러 파워를 조절하세요! 너무 세면 홈런입니다!</div>
        <a href="circle.html" class="back-btn">⬅ 뒤로가기</a>
    </div>

<script>
window.onload = function() {
    if (!sessionStorage.getItem("shootUnlocked")) return;

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    
    // 골키퍼/키커 이미지 로딩
    let isGkImageLoaded = false;
    let isKickerImageLoaded = false;
    const gkImage = new Image();
    const kickerImage = new Image();
    gkImage.onload = function() { isGkImageLoaded = true; };
    gkImage.onerror = function() { isGkImageLoaded = false; };
    kickerImage.onload = function() { isKickerImageLoaded = true; };
    kickerImage.onerror = function() { isKickerImageLoaded = false; };
    gkImage.src = "goalkeeper_front.png";
    kickerImage.src = "kicker_rear.png";
    
    let state = "MENU"; 
    let difficulty = "easy";
    let selectedDifficulty = "easy";
    const difficultyNames = { easy: "초급", normal: "중급", hard: "고급" };
    const recordKeys = { easy: "shootBest_easy", normal: "shootBest_normal", hard: "shootBest_hard" };
    let score = 0;
    let timeLeft = 60;
    let timerId;
    let animId;
    
    const goalLeft = 200, goalRight = 400, goalY = 60;
    let player = { x: 300, y: 400 };
    let ball = { x: 300, y: 400, vx: 0, vy: 0 };
    let gk = { x: 300, y: 68, width: 54, height: 84, speed: 0, targetX: 300, reactX: 0, reactTilt: 0, reactScale: 1 }; 
    let ballTrail = [];
    let shotEffectTimer = null;
    let gkReactTimer = null;
    
    let aimAngle = 0;
    let power = 0;
    let powerDir = 1;

    let circleCenter = {x: 300, y: 0};
    let circleRadius = 0;
    let playerTheta = Math.PI / 2;
    let playerDir = 1;
    let aimT = 0.5; 
    let aimDir = 1;

    function showShotEffect(textValue, className) {
        const el = document.getElementById("shotEffect");
        el.className = className;
        el.innerText = textValue;
        el.style.opacity = "1";
        el.style.transform = "translate(-50%, -50%) scale(1)";
        if (shotEffectTimer) clearTimeout(shotEffectTimer);
        shotEffectTimer = setTimeout(() => {
            el.style.opacity = "0";
            el.style.transform = "translate(-50%, -50%) scale(0.8)";
        }, 700);
    }

    function triggerKeeperReaction(kind) {
        gk.reactScale = 1.02;
        if (kind === "save") {
            gk.reactX = (ball.x < gk.x) ? -16 : 16;
            gk.reactTilt = (ball.x < gk.x) ? -0.12 : 0.12;
        } else {
            gk.reactX = (ball.x < gk.x) ? 10 : -10;
            gk.reactTilt = (ball.x < gk.x) ? 0.08 : -0.08;
        }
        if (gkReactTimer) clearTimeout(gkReactTimer);
        gkReactTimer = setTimeout(() => {
            gk.reactX = 0;
            gk.reactTilt = 0;
            gk.reactScale = 1;
        }, 220);
    }

    function getBestRecord(diff) {
        return parseInt(localStorage.getItem(recordKeys[diff]) || "0", 10);
    }

    function updateBestRecordDisplay() {
        const best = getBestRecord(selectedDifficulty);
        document.getElementById("bestRecordDisplay").innerText = `🏆 ${difficultyNames[selectedDifficulty]} 최고 기록: ${best}골`;
    }

    window.selectDifficulty = function(diff) {
        selectedDifficulty = diff;
        ["easy", "normal", "hard"].forEach(d => {
            const id = d === "easy" ? "diffEasyBtn" : d === "normal" ? "diffNormalBtn" : "diffHardBtn";
            document.getElementById(id).classList.toggle("btn-selected", d === diff);
        });
        updateBestRecordDisplay();
    };

    window.startSelectedGame = function() {
        startGame(selectedDifficulty);
    };

    window.showMenu = function() {
        document.getElementById("menuScreen").style.display = "flex";
        document.getElementById("resultScreen").style.display = "none";
        state = "MENU";
        selectDifficulty(selectedDifficulty);
    };

    function startGame(diff) {
        difficulty = diff;
        score = 0;
        timeLeft = 60;
        document.getElementById("menuScreen").style.display = "none";
        document.getElementById("scoreDisplay").innerText = `누적: 0 골`;
        document.getElementById("timeDisplay").innerText = `남은 시간: 60초`;
        
        resetPlayer();
        
        if(timerId) clearInterval(timerId);
        timerId = setInterval(() => {
            if (state !== "GAMEOVER") {
                timeLeft--;
                document.getElementById("timeDisplay").innerText = `남은 시간: ${timeLeft}초`;
                if (timeLeft <= 0) endGame();
            }
        }, 1000);
        
        cancelAnimationFrame(animId);
        gameLoop();
    };

    function endGame() {
        state = "GAMEOVER";
        clearInterval(timerId);
        const oldBest = getBestRecord(difficulty);
        let best = oldBest;
        let newRecord = false;
        if (score > oldBest) {
            localStorage.setItem(recordKeys[difficulty], String(score));
            best = score;
            newRecord = true;
        }
        document.getElementById("resultScreen").style.display = "flex";
        document.getElementById("finalScore").innerText = `총 ${score}골 달성!`;
        document.getElementById("resultBestRecord").innerText = newRecord
            ? `🎉 신기록! ${difficultyNames[difficulty]} 최고 ${best}골`
            : `🏆 ${difficultyNames[difficulty]} 최고 기록: ${best}골`;
    }

    function resetPlayer() {
        ball.vx = 0; 
        ball.vy = 0; 
        power = 0;   
        powerDir = 1;
        
        let y_c = 120 + Math.random() * 160;
        circleCenter = { x: 300, y: y_c };
        circleRadius = Math.sqrt(Math.pow(100, 2) + Math.pow(y_c - goalY, 2));
        
        playerTheta = Math.PI / 2; 
        playerDir = (Math.random() > 0.5) ? 1 : -1;
        
        aimT = 0.5; 
        aimDir = 1;
        
        ballTrail = [];
        gk.reactX = 0; gk.reactTilt = 0; gk.reactScale = 1;
        state = "AIMING";
    }

    function handleInputStart(e) {
        if (e.cancelable) e.preventDefault();
        if (state === "AIMING") {
            state = "POWERING"; 
        }
    }

    function handleInputEnd(e) {
        if (e.cancelable) e.preventDefault();
        if (state === "POWERING") {
            state = "SHOOTING";
            let speed = power * 0.25; 
            ball.vx = Math.cos(aimAngle) * speed;
            ball.vy = Math.sin(aimAngle) * speed;
        }
    }

    selectDifficulty("easy");

    canvas.addEventListener("mousedown", handleInputStart);
    canvas.addEventListener("mouseup", handleInputEnd);
    canvas.addEventListener("touchstart", handleInputStart, {passive: false});
    canvas.addEventListener("touchend", handleInputEnd, {passive: false});

    function gameLoop() {
        if (state !== "GAMEOVER") {
            update();
            draw();
            animId = requestAnimationFrame(gameLoop);
        }
    }

    function update() {
        if (difficulty === "normal") {
            gk.x = 300 + Math.sin(Date.now() / 330) * 74;
        } else if (difficulty === "hard") {
            if (Math.abs(gk.x - gk.targetX) < 10) {
                if (gk.targetX <= 300) {
                    gk.targetX = 352 + Math.random() * 22; 
                } else {
                    gk.targetX = 226 + Math.random() * 22; 
                }
                gk.speed = 4.5 + Math.random() * 3.6; 
            }
            if (gk.x < gk.targetX) gk.x += gk.speed;
            else gk.x -= gk.speed;
        } else {
            gk.x = 300; 
        }

        if (state !== "SHOOTING") {
            ballTrail = [];
        }

        if (state === "AIMING") {
            playerTheta += 0.015 * playerDir;
            if (playerTheta > Math.PI * 0.8) { playerTheta = Math.PI * 0.8; playerDir = -1; }
            else if (playerTheta < Math.PI * 0.2) { playerTheta = Math.PI * 0.2; playerDir = 1; }
            
            player.x = circleCenter.x + circleRadius * Math.cos(playerTheta);
            player.y = circleCenter.y + circleRadius * Math.sin(playerTheta);
            ball.x = player.x;
            ball.y = player.y;

            let aL = Math.atan2(goalY - player.y, goalLeft - player.x);
            let aR = Math.atan2(goalY - player.y, goalRight - player.x);
            
            aimT += 0.025 * aimDir;
            if (aimT >= 1) { aimT = 1; aimDir = -1; }
            else if (aimT <= 0) { aimT = 0; aimDir = 1; }
            
            aimAngle = aL + (aR - aL) * aimT;
        } 
        else if (state === "POWERING") {
            power += 2.5 * powerDir;
            if (power >= 100 || power <= 0) powerDir *= -1;
        }
        else if (state === "SHOOTING") {
            ballTrail.unshift({ x: ball.x, y: ball.y, r: 16, a: 0.36 });
            if (ballTrail.length > 6) ballTrail.pop();
            ball.x += ball.vx;
            ball.y += ball.vy;
            
            ball.vx *= 0.98;
            ball.vy *= 0.98;
            
            if (Math.abs(ball.vy) < 0.5 && ball.y > goalY) {
                setMessage("❌ 힘이 부족합니다!");
                state = "RESULT";
                setTimeout(resetPlayer, 1000);
            }

            if (ball.y <= goalY + 18 && ball.y >= goalY - 16) {
                if (Math.abs(ball.x - gk.x) < 43) { 
                    setMessage("선방!");
                    showShotEffect("선방!", "shot-save");
                    triggerKeeperReaction("save");
                    ball.vy *= -0.55; 
                    ball.vx *= 0.82;
                    state = "RESULT";
                    setTimeout(resetPlayer, 1000);
                }
            }

            if (ball.y <= goalY && state === "SHOOTING") {
                if (power > 85) { 
                    setMessage("❌ 홈런! 너무 세게 찼습니다!");
                } else if (ball.x > goalLeft && ball.x < goalRight) {
                    score++;
                    document.getElementById("scoreDisplay").innerText = `누적: ${score} 골`;
                    setMessage("골!");
                    showShotEffect("골!", "shot-goal");
                    triggerKeeperReaction("goal");
                } else {
                    setMessage("❌ 노골! 빗나갔습니다.");
                }
                state = "RESULT";
                setTimeout(resetPlayer, 1000);
            }
        }
    }

    function setMessage(msg) {
        document.getElementById("msgBox").innerText = msg;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.strokeStyle = "rgba(255,255,255,0.5)";
        ctx.lineWidth = 3;
        ctx.strokeRect(100, -10, 400, 150);
        ctx.beginPath();
        ctx.arc(300, 140, 60, 0, Math.PI, false);
        ctx.stroke();
        
        if (state === "AIMING" || state === "POWERING") {
            ctx.beginPath();
            ctx.arc(circleCenter.x, circleCenter.y, circleRadius, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(player.x, player.y);
            ctx.lineTo(goalLeft, goalY);
            ctx.lineTo(goalRight, goalY);
            ctx.closePath();
            ctx.fillStyle = "rgba(241, 196, 15, 0.3)";
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(player.x, player.y);
            ctx.lineTo(goalLeft, goalY);
            ctx.moveTo(player.x, player.y);
            ctx.lineTo(goalRight, goalY);
            ctx.strokeStyle = "rgba(241, 196, 15, 0.8)";
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        ctx.fillStyle = "#fff";
        ctx.fillRect(goalLeft - 5, goalY - 10, 10, 20);
        ctx.fillRect(goalRight - 5, goalY - 10, 10, 20);
        
        ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
        ctx.fillRect(goalLeft, goalY - 10, 200, 10); 

        if (state === "AIMING" || state === "POWERING") {
            ctx.beginPath();
            ctx.moveTo(player.x, player.y);
            ctx.lineTo(player.x + Math.cos(aimAngle) * 120, player.y + Math.sin(aimAngle) * 120);
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 4;
            ctx.setLineDash([8, 5]);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        if (state === "POWERING") {
            ctx.fillStyle = "#333";
            ctx.fillRect(player.x - 35, player.y + 35, 70, 12);
            
            let barColor = "#e74c3c"; 
            if (power > 30 && power < 85) barColor = "#2ecc71"; 
            
            ctx.fillStyle = barColor;
            ctx.fillRect(player.x - 35, player.y + 35, 70 * (power / 100), 12);
        }

        ctx.globalAlpha = 1.0;
        ctx.fillStyle = "#000000"; 
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        if (ballTrail.length) {
            for (let i = 0; i < ballTrail.length; i++) {
                const t = ballTrail[i];
                ctx.save();
                ctx.globalAlpha = Math.max(0, t.a - i * 0.05);
                ctx.beginPath();
                ctx.arc(t.x, t.y, Math.max(6, t.r - i * 1.5), 0, Math.PI * 2);
                ctx.fillStyle = i < 3 ? "rgba(255,255,255,0.9)" : "rgba(255,235,150,0.65)";
                ctx.fill();
                ctx.restore();
            }
        }

        // 골키퍼
        if (isGkImageLoaded) {
            ctx.save();
            ctx.translate(gk.x + gk.reactX, gk.y);
            ctx.rotate(gk.reactTilt);
            ctx.scale(gk.reactScale, gk.reactScale);
            ctx.drawImage(gkImage, -gk.width, -gk.height / 2, gk.width * 2, gk.height);
            ctx.restore();
        } else {
            ctx.font = "60px Arial";
            ctx.fillText("🧍‍♂️", gk.x, gk.y);
        }

        // 키커
        if (state === "AIMING" || state === "POWERING" || state === "SHOOTING" || state === "RESULT") {
            if (isKickerImageLoaded) {
                ctx.drawImage(kickerImage, player.x - 48, player.y - 68, 96, 132);
            } else {
                ctx.font = "55px Arial";
                ctx.fillText("🏃", player.x - 25, player.y - 15);
            }
        }

        // 공
        ctx.font = "38px Arial";
        ctx.fillText("⚽", ball.x, ball.y);
    }
};
</script>
</body>
</html>
