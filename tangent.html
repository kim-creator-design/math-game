<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동탄 가시거리 계산기</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #2f3640; color: white; text-align: center; margin-top: 50px; }
        .game-panel { background: #353b48; padding: 20px; border-radius: 15px; display: inline-block; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        canvas { background-color: #1e272e; border: 3px solid #7f8fa6; border-radius: 10px; margin-top: 15px; }
        button { background: #e74c3c; color: white; border: none; padding: 15px 30px; font-size: 1.2rem; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 20px; }
        h1 { color: #fbc531; margin-bottom: 5px; }
        #msg { color: #4cd137; font-size: 1.2rem; font-weight: bold; margin-top: 15px; min-height: 30px; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: #f5f6fa; text-decoration: none; background: #576574; padding: 10px 20px; border-radius: 5px; }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">⬅ 메인 메뉴로 돌아가기</a>
    
    <div class="game-panel">
        <h1>🔭 레이저 접선 맞추기</h1>
        <p id="heightDisplay">현재 관측 고도: 준비 중...</p>
        
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        <br>
        <button id="actionBtn" onclick="toggleGame()">정지! 🛑</button>
        <div id="msg">목표: 레이저가 지구와 90도(접선)가 될 때 정지하세요!</div>
    </div>

    <script>
        // 1. 페이지가 열리자마자 비밀번호를 묻습니다.
        let pwd = prompt("가시거리 계산기입니다. 비밀번호를 입력하세요 🔒");
        
        if (pwd !== "4885") {
            alert("비밀번호가 틀렸습니다! 메인 화면으로 돌아갑니다.");
            window.location.href = "index.html"; // 틀리면 쫓아냄
        } else {
            // 2. 비밀번호(4885)가 맞으면 게임을 시작합니다.
            let canvas = document.getElementById("gameCanvas");
            let ctx = canvas.getContext("2d");
            let isPlaying = true;
            let currentAngle = 10;
            let angleSpeed = 1.2;
            let animId;
            let realHeight = Math.floor(Math.random() * 4900) + 100;
            
            document.getElementById("heightDisplay").innerText = `현재 관측 고도: ${realHeight} m`;

            const earthX = 300, earthY = 450, earthR = 200; 
            let canvasHeight = 30 + (realHeight / 5000) * 80; 
            let personY = earthY - earthR - canvasHeight;
            
            let dist_OP = earthY - personY; 
            let targetAngle = Math.asin(earthR / dist_OP) * (180 / Math.PI); 

            function draw() {
                ctx.clearRect(0, 0, 600, 400);

                // 지구
                ctx.beginPath();
                ctx.arc(earthX, earthY, earthR, 0, Math.PI * 2);
                ctx.fillStyle = "#3498db";
                ctx.fill();

                // 타워
                ctx.fillStyle = "#95a5a6";
                ctx.fillRect(earthX - 5, personY, 10, canvasHeight);
                ctx.fillStyle = "#ff4757";
                ctx.beginPath();
                ctx.arc(earthX, personY, 5, 0, Math.PI*2);
                ctx.fill();

                // 레이저
                let rad = currentAngle * (Math.PI / 180);
                let endX = earthX + 600 * Math.sin(rad);
                let endY = personY + 600 * Math.cos(rad);

                ctx.beginPath();
                ctx.moveTo(earthX, personY);
                ctx.lineTo(endX, endY);
                ctx.strokeStyle = "#ff4757";
                ctx.lineWidth = 3;
                ctx.stroke();

                if (isPlaying) {
                    currentAngle += angleSpeed;
                    if (currentAngle > 60 || currentAngle < 5) angleSpeed *= -1;
                    animId = requestAnimationFrame(draw);
                } else {
                    // 정지 시 결과 판정
                    if (Math.abs(currentAngle - targetAngle) < 2) {
                        let R = 6371; 
                        let h = realHeight / 1000; 
                        let dist = Math.sqrt(Math.pow(R + h, 2) - Math.pow(R, 2));
                        document.getElementById("msg").innerHTML = `🎉 완벽한 접선입니다!<br>가시거리는 약 <b style="color:#fbc531;">${dist.toFixed(1)} km</b> 입니다.`;
                    } else {
                        document.getElementById("msg").innerHTML = `<span style="color:#ff4757;">❌ 실패! 지구 표면을 정확히 스치는 접선(90도)이 아닙니다.</span>`;
                    }
                }
            }

            window.toggleGame = function() {
                if (isPlaying) {
                    isPlaying = false;
                    document.getElementById("actionBtn").innerText = "다시 하기 🔄";
                    document.getElementById("actionBtn").style.background = "#2ecc71";
                } else {
                    location.reload(); // 다시하기 누르면 페이지 새로고침
                }
            };

            draw(); // 그리기 시작
        }
    </script>
</body>
</html>
