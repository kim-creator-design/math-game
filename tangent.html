<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동탄 가시거리 계산기</title>
<style>
    body { font-family: 'Malgun Gothic', sans-serif; background-color: #2f3640; color: white; text-align: center; margin: 0; padding: 20px; }
    .container { max-width: 950px; margin: 0 auto; background: #353b48; padding: 30px; border-radius: 15px; box-shadow: 0 8px 16px rgba(0,0,0,0.3); }
    h1 { color: #fbc531; }
    
    .game-area { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin: 20px 0; }
    canvas { background: #1e272e; border-radius: 10px; border: 3px solid #dcdde1; }
    
    #mapContainer { display: none; flex-direction: column; align-items: center; background: #2f3640; padding: 15px; border-radius: 10px; border: 3px dashed #fbc531; }
    
    .btn { padding: 15px 30px; font-size: 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: #e74c3c; color: white; transition: 0.2s; }
    .btn:hover { transform: scale(1.05); }
    #msg { font-size: 20px; font-weight: bold; margin-top: 15px; min-height: 60px; line-height: 1.5; }
    #heightDisplay { font-size: 22px; color: #fbc531; font-weight: bold; margin-bottom: 10px; }
</style>

<script>
    (async function checkAuth() {
        if (!sessionStorage.getItem("tangentUnlocked")) {
            const pwd = prompt("가시거리 계산기 비밀번호를 입력하세요 🔒");
            if (pwd) {
                const buffer = new TextEncoder().encode(pwd);
                const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
                const hashHex = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
                
                if (hashHex === "4e49800fbc3cefb76b1b887fa36a8dbd6dd283667258c613e1754fa3d266fefb") {
                    sessionStorage.setItem("tangentUnlocked", "true");
                    location.reload(); 
                    return;
                }
            }
            alert("비밀번호가 틀렸습니다! ❌");
            location.href = "index.html";
        }
    })();
</script>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
            <a href="index.html" style="color: #2f3640; text-decoration: none; background: #fbc531; padding: 10px 20px; border-radius: 8px; font-weight: bold;">⬅ 메뉴로</a>
        </div>

        <h1>🔭 동탄 가시거리 계산기 🔭</h1>
        <div id="heightDisplay">현재 관측 고도: 준비 중.....</div>
        
        <div class="game-area">
            <canvas id="gameCanvas" width="600" height="400"></canvas>
            
            <div id="mapContainer">
                <h3 style="margin: 0 0 10px 0; color: #fbc531;">📡 시야 도달 범위</h3>
                <canvas id="mapCanvas" width="250" height="360"></canvas>
            </div>
        </div>
        
        <div>
            <button id="actionBtn" class="btn" onclick="toggleGame()">정지! 🛑</button>
        </div>
        
        <div id="msg">목표: 레이저가 지구와 딱 스치는 접선(90도)이 될 때 정지하세요!</div>
    </div>

<script>
window.onload = function() {
    if (!sessionStorage.getItem("tangentUnlocked")) return;

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    let isPlaying = false;
    let currentAngle = 10;
    let angleSpeed = 1.3;
    let animId;
    let realHeight, canvasHeight, personY, dist_OP, targetAngle;
    const earthX = 300, earthY = 450, earthR = 200;

    // 🌟 도시 목록을 훨씬 디테일하게 업데이트했습니다.
    function getVisibleCity(km) {
        if (km < 30) return "수원, 오산, 용인, 안성, 평택";
        if (km < 50) return "서울 강남, 성남, 과천, 안산, 천안";
        if (km < 70) return "서울 강북, 인천, 김포, 여주, 당진, 아산";
        if (km < 100) return "춘천, 원주, 충주, 서산, [북한] 개성";
        if (km < 130) return "대전(105km), 세종, 청주, 강릉, 속초";
        if (km < 160) return "전주, 안동, 상주, 태백, [북한] 해주(145km)";
        if (km < 200) return "대구, 군산, 남원, 포항, [북한] 사리원";
        if (km < 250) return "광주, 진주, 울산, [북한] 평양(220km), 원산";
        if (km < 300) return "부산(270km), 창원, 목포, 여수, [북한] 함흥";
        if (km < 350) return "제주도(한라산), 완도, [북한] 신의주, 혜산";
        return "제주도 전역, 마라도, [북한] 청진, 나선";
    }

    function drawMap(dist) {
        const mCanvas = document.getElementById("mapCanvas");
        const mCtx = mCanvas.getContext("2d");
        document.getElementById("mapContainer").style.display = "flex"; 

        mCtx.clearRect(0, 0, 250, 360);

        // 한반도 지도 그리기
        mCtx.fillStyle = "#576574"; 
        mCtx.strokeStyle = "#8395a7";
        mCtx.lineWidth = 1;
        mCtx.beginPath();
        mCtx.moveTo(60, 90); 
        mCtx.lineTo(180, 30); 
        mCtx.lineTo(220, 50); 
        mCtx.lineTo(170, 150); 
        mCtx.lineTo(160, 190); 
        mCtx.lineTo(185, 270); 
        mCtx.lineTo(185, 305); 
        mCtx.lineTo(140, 315); 
        mCtx.lineTo(100, 320); 
        mCtx.lineTo(100, 270); 
        mCtx.lineTo(90, 205);  
        mCtx.lineTo(70, 190);  
        mCtx.lineTo(80, 140);  
        mCtx.closePath();
        mCtx.fill();
        mCtx.stroke();

        // 제주도, 울릉도
        mCtx.beginPath(); mCtx.arc(90, 350, 7, 0, Math.PI*2); mCtx.fill(); mCtx.stroke();
        mCtx.beginPath(); mCtx.arc(215, 200, 3, 0, Math.PI*2); mCtx.fill(); mCtx.stroke();

        const dtX = 112, dtY = 215; 
        const radiusPx = dist / 2.6; 

        // 가시거리 원 그리기
        mCtx.beginPath();
        mCtx.arc(dtX, dtY, radiusPx, 0, Math.PI*2);
        mCtx.fillStyle = "rgba(251, 197, 49, 0.4)"; 
        mCtx.fill();
        mCtx.strokeStyle = "#fbc531";
        mCtx.lineWidth = 2;
        mCtx.stroke();

        // 🌟 지도 위 주요 도시 위치 업데이트 (인천, 강릉, 원산, 제주 등 추가)
        const cities = [
            { name: "동탄", x: dtX, y: dtY, color: "#ff4757" },
            { name: "서울", x: 110, y: 195, color: "white" },
            { name: "인천", x: 92, y: 195, color: "white" },
            { name: "강릉", x: 155, y: 180, color: "white" },
            { name: "대전", x: 125, y: 245, color: "white" },
            { name: "광주", x: 110, y: 290, color: "white" },
            { name: "부산", x: 175, y: 300, color: "white" },
            { name: "제주", x: 90, y: 350, color: "white" },
            { name: "해주", x: 75, y: 175, color: "white" },
            { name: "원산", x: 140, y: 140, color: "white" },
            { name: "평양", x: 95, y: 145, color: "white" }
        ];

        mCtx.font = "11px 'Malgun Gothic', sans-serif";
        cities.forEach(c => {
            mCtx.beginPath();
            mCtx.arc(c.x, c.y, (c.name==="동탄"?4:2), 0, Math.PI*2);
            mCtx.fillStyle = c.color;
            mCtx.fill();
            
            mCtx.fillStyle = c.color;
            mCtx.fillText(c.name, c.x + 6, c.y + 4);
        });
    }

    function initGame() {
        // 70% 확률: 100m ~ 1000m (50m 간격) / 30% 확률: 1050m ~ 5000m (50m 간격)
        let rand = Math.random();
        
        if (rand < 0.70) {
            let step = Math.floor(Math.random() * 19); 
            realHeight = 100 + (step * 50);
        } else {
            let step = Math.floor(Math.random() * 80); 
            realHeight = 1050 + (step * 50);
        }
        
        document.getElementById("heightDisplay").innerHTML = `현재 관측 고도: ${realHeight} m`;
        document.getElementById("msg").innerHTML = "목표: 레이저가 지구와 딱 스치는 접선(90도)이 될 때 정지하세요!";
        document.getElementById("msg").style.color = "#4cd137";
        document.getElementById("actionBtn").innerText = "정지! 🛑";
        document.getElementById("actionBtn").style.background = "#e74c3c";
        
        document.getElementById("mapContainer").style.display = "none"; 

        canvasHeight = 20 + (realHeight / 5000) * 80;
        personY = earthY - earthR - canvasHeight;
        dist_OP = earthY - personY;
        targetAngle = Math.asin(earthR / dist_OP) * (180 / Math.PI);
        currentAngle = 10;
        isPlaying = true;
        cancelAnimationFrame(animId);
        draw();
    }

    function draw() {
        ctx.clearRect(0, 0, 600, 400);
        
        ctx.beginPath();
        ctx.arc(earthX, earthY, earthR, 0, Math.PI * 2);
        ctx.fillStyle = "#3498db";
        ctx.fill();
        
        ctx.fillStyle = "#95a5a6";
        ctx.fillRect(earthX - 5, personY, 10, canvasHeight);
        ctx.fillStyle = "#ff4757";
        ctx.beginPath();
        ctx.arc(earthX, personY, 6, 0, Math.PI*2);
        ctx.fill();
        
        let rad = currentAngle * (Math.PI / 180);
        let endX = earthX + 700 * Math.sin(rad);
        let endY = personY + 700 * Math.cos(rad);
        
        ctx.beginPath();
        ctx.moveTo(earthX, personY);
        ctx.lineTo(endX, endY);
        ctx.strokeStyle = "#ff4757";
        ctx.lineWidth = 3;
        if(!isPlaying) ctx.setLineDash([10, 5]);
        ctx.stroke();
        ctx.setLineDash([]);

        if (isPlaying) {
            currentAngle += angleSpeed;
            if (currentAngle > 85 || currentAngle < 5) angleSpeed *= -1;
            animId = requestAnimationFrame(draw);
        } else {
            if (Math.abs(currentAngle - targetAngle) <= 2) {
                let R = 6371;
                let h = realHeight / 1000;
                let dist = Math.sqrt(Math.pow(R + h, 2) - Math.pow(R, 2));
                let city = getVisibleCity(dist);
                
                document.getElementById("msg").innerHTML = `🎉 정확한 접선입니다!<br>가시거리는 약 ${dist.toFixed(1)} km 이며,<br>동탄에서 [${city}] 등 여러 지역이 보입니다!`;
                
                drawMap(dist);
            } else {
                document.getElementById("msg").innerHTML = `❌ 실패! 레이저가 지구를 뚫고 가거나 허공을 향했습니다.<br>(팁: 지구 표면을 정확히 스쳐야 합니다)`;
            }
        }
    }

    window.toggleGame = function() {
        if (isPlaying) {
            isPlaying = false;
            document.getElementById("actionBtn").innerText = "새로운 고도에서 다시 하기 🔄";
            document.getElementById("actionBtn").style.background = "#2ecc71";
        } else {
            initGame();
        }
    };

    initGame();
};
</script>
</body>
</html>
