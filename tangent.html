<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가시거리 계산하기 (원의 접선)</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #2f3640;
            color: #f5f6fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .header {
            width: 100%;
            max-width: 700px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .back-btn {
            text-decoration: none;
            color: white;
            background: #576574;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
        }
        h2 { color: #fbc531; margin: 0; }

        .game-panel {
            background: #353b48;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            text-align: center;
            width: 100%;
            max-width: 650px;
        }

        .status-board {
            background: #222f3e;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 2px solid #576574;
        }
        
        #heightDisplay {
            font-size: 1.2rem;
            color: #00d2d3;
            font-weight: bold;
            margin-bottom: 8px;
        }

        #msg {
            font-size: 1.3rem;
            font-weight: bold;
            color: #4cd137;
            min-height: 30px;
        }

        canvas {
            background-color: #1e272e;
            border: 3px solid #7f8fa6;
            border-radius: 10px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        button.action-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        button.action-btn:hover { transform: scale(1.05); }
    </style>

    <script>
        // 힌트 제거된 비밀번호 확인
        if (!sessionStorage.getItem("tangentPass")) {
            const pwd = prompt("가시거리 계산 게임입니다. 비밀번호를 입력하세요 🔒");
            if (pwd === "2024") {
                sessionStorage.setItem("tangentPass", "true");
            } else {
                alert("비밀번호가 틀렸습니다! 메인 화면으로 돌아갑니다. ❌");
                location.href = "index.html"; 
            }
        }
    </script>
</head>
<body>

    <div class="header">
        <a href="circle.html" class="back-btn">⬅ 메뉴로</a>
        <h2>🔭 타워에서 어디까지 보일까?</h2>
        <div style="width: 80px;"></div>
    </div>

    <div class="game-panel">
        <div class="status-board">
            <div id="heightDisplay">현재 전망대 높이: 준비 중...</div>
            <div id="msg">목표: 레이저가 지구와 정확히 '접선(90도)'이 될 때 멈추세요!</div>
        </div>
        
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        
        <div>
            <button class="action-btn" id="actionBtn" onclick="toggleGame()">정지! 🛑</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // 지구 기본 설정 (캔버스 상의 크기)
        const earthX = 300;
        const earthY = 450;
        const earthR = 200; 

        // 게임 변수들
        let realHeight = 0;      // 실제 건물 높이 (m)
        let canvasHeight = 0;    // 화면에 그릴 건물 기둥 높이
        let personY = 0;         // 사람(관찰자)의 캔버스 Y좌표
        
        let laserTargetAngleDeg = 0;  // 맞춰야 하는 정답 레이저 각도
        let centerTargetAngleRad = 0; // 중심에서 접점까지의 실제 각도(라디안)

        let currentAngle = 10;
        let angleSpeed = 1.2;
        let isPlaying = false;
        let animId;

        // 게임 초기화 (새로운 높이 생성)
        function initGame() {
            // 1. 랜덤 높이 생성 (10m ~ 555m 롯데타워 급까지)
            realHeight = Math.floor(Math.random() * 546) + 10;
            document.getElementById("heightDisplay").innerText = `현재 전망대 높이: ${realHeight} m`;
            document.getElementById("msg").innerHTML = "목표: 레이저가 지구와 정확히 '접선(90도)'이 될 때 멈추세요!";
            document.getElementById("msg").style.color = "#4cd137";

            // 2. 캔버스 비율에 맞게 높이 계산
            // 실제 10~555m를 캔버스 20~100픽셀로 매핑
            canvasHeight = 20 + (realHeight / 555) * 80; 
            personY = earthY - earthR - canvasHeight;
            
            // 3. 수학 계산 (접선 각도 구하기)
            const dist_OP = earthY - personY; // 중심(O)부터 사람(P)까지 캔버스 거리
            
            // 레이저가 스윙해야 하는 정답 각도 (수직선 기준)
            laserTargetAngleDeg = Math.asin(earthR / dist_OP) * (180 / Math.PI); 
            // 중심에서 접점을 향하는 반지름 각도
            centerTargetAngleRad = Math.acos(earthR / dist_OP);

            // 4. 애니메이션 상태 리셋
            currentAngle = 10;
            angleSpeed = 1.2;
            isPlaying = true;
            document.getElementById("actionBtn").innerText = "정지! 🛑";
            document.getElementById("actionBtn").style.background = "#e74c3c";
            
            cancelAnimationFrame(animId);
            drawGame();
        }

        function drawGame() {
            ctx.clearRect(0, 0, 600, 400);

            // 1. 지구
            ctx.beginPath();
            ctx.arc(earthX, earthY, earthR, 0, Math.PI * 2);
            ctx.fillStyle = "#2980b9";
            ctx.fill();
            ctx.strokeStyle = "#3498db";
            ctx.lineWidth = 4;
            ctx.stroke();

            // 2. 타워 기둥과 관찰자(빨간점)
            ctx.fillStyle = "#95a5a6";
            ctx.fillRect(earthX - 10, personY, 20, canvasHeight);
            ctx.fillStyle = "#ff4757";
            ctx.beginPath();
            ctx.arc(earthX, personY, 6, 0, Math.PI*2);
            ctx.fill();

            // 3. 레이저 선
            const rad = currentAngle * (Math.PI / 180);
            const laserEndX = earthX + 600 * Math.sin(rad);
            const laserEndY = personY + 600 * Math.cos(rad);

            ctx.beginPath();
            ctx.moveTo(earthX, personY);
            ctx.lineTo(laserEndX, laserEndY);
            ctx.strokeStyle = "#ff4757";
            ctx.lineWidth = 3;
            if(!isPlaying) ctx.setLineDash([10, 5]); // 정지 시 점선
            ctx.stroke();
            ctx.setLineDash([]);

            // 4. 멈췄을 때의 정답 판정
            if (!isPlaying) {
                // 오차 허용 범위 (± 1.5도)
                if (Math.abs(currentAngle - laserTargetAngleDeg) <= 1.5) {
                    
                    // 정확한 접점(Tangent Point) 좌표 계산
                    const tangentX = earthX + earthR * Math.sin(centerTargetAngleRad);
                    const tangentY = earthY - earthR * Math.cos(centerTargetAngleRad);
                    
                    // 중심에서 접점까지 파란 점선 (반지름)
                    ctx.beginPath();
                    ctx.moveTo(earthX, earthY);
                    ctx.lineTo(tangentX, tangentY);
                    ctx.strokeStyle = "#3498db";
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // 직각(90도) 마크 그리기 (정확한 수학적 위치 계산)
                    drawRightAngle(tangentX, tangentY, earthX, earthY, earthX, personY);

                    // 실제 가시거리 계산 (피타고라스 정리: d^2 = (R+h)^2 - R^2)
                    const R_km = 6371; // 실제 지구 반지름(km)
                    const h_km = realHeight / 1000; // m -> km 변환
                    const viewDistance = Math.sqrt(Math.pow(R_km + h_km, 2) - Math.pow(R_km, 2));

                    // 성공 메시지 및 계산 결과 출력
                    let resultMsg = `🎉 완벽한 90도! 가시거리는 약 <span style="color:#fbc531;">${viewDistance.toFixed(1)} km</span> 입니다.`;
                    if(viewDistance > 80) resultMsg += " (엄청 멀리 보이네요!)";
                    
                    document.getElementById("msg").innerHTML = resultMsg;
                    document.getElementById("msg").style.color = "#00d2d3";

                } else {
                    document.getElementById("msg").innerHTML = "❌ 실패! 접선이 아닙니다. (지구를 관통하거나 허공을 가릅니다)";
                    document.getElementById("msg").style.color = "#ff4757";
                }
            }

            // 레이저 애니메이션 계속 진행
            if (isPlaying) {
                currentAngle += angleSpeed;
                // 각도 왕복 (10도 ~ 65도)
                if (currentAngle > 65 || currentAngle < 10) angleSpeed *= -1;
                animId = requestAnimationFrame(drawGame);
            }
        }

        // 직각(90도) 표시를 정확히 그려주는 헬퍼 함수
        function drawRightAngle(tX, tY, oX, oY, pX, pY) {
            // T->O 벡터
            const toX = oX - tX;
            const toY = oY - tY;
            const toLen = Math.hypot(toX, toY);
            const ux = toX / toLen;
            const uy = toY / toLen;

            // T->P 벡터
            const tpX = pX - tX;
            const tpY = pY - tY;
            const tpLen = Math.hypot(tpX, tpY);
            const vx = tpX / tpLen;
            const vy = tpY / tpLen;

            // 15px 크기의 정사각형 모서리 그리기
            const size = 18;
            const p1x = tX + size * ux;
            const p1y = tY + size * uy;
            const p2x = tX + size * ux + size * vx;
            const p2y = tY + size * uy + size * vy;
            const p3x = tX + size * vx;
            const p3y = tY + size * vy;

            ctx.beginPath();
            ctx.moveTo(p1x, p1y);
            ctx.lineTo(p2x, p2y);
            ctx.lineTo(p3x, p3y);
            ctx.strokeStyle = "#fbc531";
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function toggleGame() {
            if (isPlaying) {
                // 게임 멈춤
                isPlaying = false;
                document.getElementById("actionBtn").innerText = "다시 발사 🔫 (랜덤 높이)";
                document.getElementById("actionBtn").style.background = "#2ecc71";
            } else {
                // 새로운 랜덤 높이로 다시 시작
                initGame();
            }
        }

        // 최초 실행
        initGame();
    </script>
</body>
</html>
