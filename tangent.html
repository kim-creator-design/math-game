<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동탄 가시거리 계산기</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #2f3640; color: white; text-align: center; margin-top: 50px; }
        .game-panel { background: #353b48; padding: 20px; border-radius: 15px; display: inline-block; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        canvas { background-color: #1e272e; border: 3px solid #7f8fa6; border-radius: 10px; margin-top: 15px; }
        button { background: #e74c3c; color: white; border: none; padding: 15px 30px; font-size: 1.2rem; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 20px; transition: 0.2s; }
        button:hover { transform: scale(1.05); }
        h1 { color: #fbc531; margin-bottom: 5px; }
        #msg { color: #4cd137; font-size: 1.2rem; font-weight: bold; margin-top: 15px; min-height: 50px; line-height: 1.5; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: #f5f6fa; text-decoration: none; background: #576574; padding: 10px 20px; border-radius: 5px; }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">⬅ 메인 메뉴로 돌아가기</a>
    
    <div class="game-panel">
        <h1>🔭 레이저 접선 맞추기</h1>
        <p id="heightDisplay" style="font-size: 1.1rem; color: #00d2d3;">현재 관측 고도: 준비 중...</p>
        
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        <br>
        <button id="actionBtn" onclick="toggleGame()">정지! 🛑</button>
        <div id="msg">목표: 레이저가 지구와 90도(접선)가 될 때 정지하세요!</div>
    </div>

    <script>
        // 1. 처음 들어왔을 때만 비밀번호(4885)를 묻도록 처리합니다.
        if (!sessionStorage.getItem("tangentUnlocked")) {
            let pwd = prompt("가시거리 계산기입니다. 비밀번호를 입력하세요 🔒");
            if (pwd === "4885") {
                sessionStorage.setItem("tangentUnlocked", "true"); // 통과 기록 저장
            } else {
                alert("비밀번호가 틀렸습니다! 메인 화면으로 돌아갑니다.");
                window.location.href = "index.html";
            }
        }

        // 2. 비밀번호를 통과한 상태라면 게임을 준비합니다.
        if (sessionStorage.getItem("tangentUnlocked") === "true") {
            let canvas = document.getElementById("gameCanvas");
            let ctx = canvas.getContext("2d");
            
            let isPlaying = false;
            let currentAngle = 10;
            let angleSpeed = 1.3;
            let animId;
            let realHeight, canvasHeight, personY, dist_OP, targetAngle;

            const earthX = 300, earthY = 450, earthR = 200; 

            // 동탄 기준 가시거리에 따른 관측 가능 도시 판별 함수
            function getVisibleCity(km) {
                if (km < 40) return "서울(강남), 성남, 용인, 평택";
                if (km < 70) return "인천, 과천, 천안, 아산";
                if (km < 110) return "청주, 세종, 당진, 충주";
                if (km < 160) return "대전, 전주, 원주, 군산";
                if (km < 210) return "대구, 광주, 상주, 지리산";
                return "부산, 울산, 창원, 목포 (한반도 남단!)";
            }

            // 게임을 초기화하고 시작하는 함수 (새로고침 없이 재시작할 때 쓰임)
            function initGame() {
                // 고도는 100m ~ 5000m 사이로 설정
                realHeight = Math.floor(Math.random() * 4901) + 100;
                document.getElementById("heightDisplay").innerHTML = `현재 관측 고도: <b>${realHeight} m</b>`;
                document.getElementById("msg").innerHTML = "목표: 레이저가 지구와 딱 스치는 접선(90도)이 될 때 정지하세요!";
                document.getElementById("msg").style.color = "#4cd137";
                
                document.getElementById("actionBtn").innerText = "정지! 🛑";
                document.getElementById("actionBtn").style.background = "#e74c3c";

                // 비율에 맞게 캔버스에 그릴 높이 계산
                canvasHeight = 20 + (realHeight / 5000) * 80; 
                personY = earthY - earthR - canvasHeight;
                
                dist_OP = earthY - personY; 
                targetAngle = Math.asin(earthR / dist_OP) * (180 / Math.PI); 

                currentAngle = 10;
                isPlaying = true;
                
                cancelAnimationFrame(animId);
                draw();
            }

            function draw() {
                ctx.clearRect(0, 0, 600, 400);

                // 지구 그리기
                ctx.beginPath();
                ctx.arc(earthX, earthY, earthR, 0, Math.PI * 2);
                ctx.fillStyle = "#3498db";
                ctx.fill();

                // 타워 및 사람 그리기
                ctx.fillStyle = "#95a5a6";
                ctx.fillRect(earthX - 5, personY, 10, canvasHeight);
                ctx.fillStyle = "#ff4757";
                ctx.beginPath();
                ctx.arc(earthX, personY, 6, 0, Math.PI*2);
                ctx.fill();

                // 레이저 그리기
                let rad = currentAngle * (Math.PI / 180);
                let endX = earthX + 700 * Math.sin(rad);
                let endY = personY + 700 * Math.cos(rad);

                ctx.beginPath();
                ctx.moveTo(earthX, personY);
                ctx.lineTo(endX, endY);
                ctx.strokeStyle = "#ff4757";
                ctx.lineWidth = 3;
                if(!isPlaying) ctx.setLineDash([10, 5]); // 멈추면 점선으로 변경
                ctx.stroke();
                ctx.setLineDash([]);

                if (isPlaying) {
                    currentAngle += angleSpeed;
                    // 레이저 범위를 5도(거의 수직) ~ 85도(우주 허공)까지 넒게 스윙하도록 수정
                    if (currentAngle > 85 || currentAngle < 5) angleSpeed *= -1;
                    animId = requestAnimationFrame(draw);
                } else {
                    // 정지 시 결과 판정 (오차범위 2도 이내면 정답 처리)
                    if (Math.abs(currentAngle - targetAngle) <= 2) {
                        let R = 6371; 
                        let h = realHeight / 1000; 
                        // 피타고라스 정리: d = √( (R+h)² - R² )
                        let dist = Math.sqrt(Math.pow(R + h, 2) - Math.pow(R, 2));
                        let city = getVisibleCity(dist);
                        
                        document.getElementById("msg").innerHTML = 
                            `🎉 <b>정확한 접선입니다!</b><br>` +
                            `가시거리는 약 <span style="color:#fbc531;">${dist.toFixed(1)} km</span> 이며,<br>` +
                            `<span style="color:#00d2d3;">동탄에서 <b>[${city}]</b> 까지 보입니다!</span>`;
                    } else {
                        document.getElementById("msg").innerHTML = `<span style="color:#ff4757;">❌ 실패! 레이저가 지구를 뚫고 가거나 허공을 향했습니다.<br>(팁: 지구 표면을 정확히 스쳐야 합니다)</span>`;
                    }
                }
            }

            // 버튼 클릭 시 정지하거나 재시작하는 함수
            window.toggleGame = function() {
                if (isPlaying) {
                    isPlaying = false;
                    document.getElementById("actionBtn").innerText = "새로운 고도에서 다시 하기 🔄";
                    document.getElementById("actionBtn").style.background = "#2ecc71";
                } else {
                    initGame(); // 새로고침 없이 바로 게임 재시작
                }
            };

            // 처음 시작
            initGame(); 
        }
    </script>
</body>
</html>
