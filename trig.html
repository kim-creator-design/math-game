<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼각비 드래그 퍼즐</title>
    <link rel="stylesheet" href="style.css"> <link rel="stylesheet" href="trig.css">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <a href="index.html" class="back-btn">⬅ 메인으로</a>
            <h2>📐 삼각비 드래그 퍼즐</h2>
        </div>
        
        <div class="triangle-diagram">
            <img src="triangle_diagram.png" alt="직각삼각형 정의"> </div>

        <p class="instruction">블록을 끌어서 빈칸에 쏙 집어넣으세요!</p>

        <div class="question-area">
            <h1 id="question-title">sin</h1>
        </div>

        <div class="fraction-builder">
            <div class="slot" id="slot-top" ondrop="drop(event)" ondragover="allowDrop(event)">분자 (?)</div>
            <div class="fraction-line"></div>
            <div class="slot" id="slot-bottom" ondrop="drop(event)" ondragover="allowDrop(event)">분모 (?)</div>
        </div>

        <div class="block-area">
            <div class="word-block" id="block-hypotenuse" draggable="true" ondragstart="drag(event)">빗변</div>
            <div class="word-block" id="block-adjacent" draggable="true" ondragstart="drag(event)">밑변</div>
            <div class="word-block" id="block-opposite" draggable="true" ondragstart="drag(event)">높이</div>
        </div>

        <button class="reset-btn" onclick="resetSlots()">비우기 🔄</button>

        <div id="message" class="message"></div>
    </div>

    <script src="trig.js"></script>
</body>
</html>
