<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>특수각 괴물 추격전</title>
<style>
    body { font-family: 'Malgun Gothic', sans-serif; background-color: #2f3640; color: white; text-align: center; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: #353b48; padding: 30px; border-radius: 15px; box-shadow: 0 8px 16px rgba(0,0,0,0.3); }
    h1 { color: #fbc531; }
    .btn { padding: 15px 30px; font-size: 20px; margin: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn:hover { transform: scale(1.05); }
    .btn-easy { background: #2ecc71; color: white; }
    .btn-normal { background: #f39c12; color: white; }
    .btn-hard { background: #e74c3c; color: white; }
    
   #track { position: relative; width: 100%; height: 160px; background: #7f8fa6; border-radius: 10px; margin: 30px 0; overflow: hidden; border: 3px solid #dcdde1; }
    .safe-zone { position: absolute; right: 0; top: 0; width: 15%; height: 100%; background: rgba(46, 204, 113, 0.5); border-left: 5px dashed #2ecc71; }
    
    /* 🌟 캐릭터 크기 50% 증가 (80px -> 120px) */
    .character { position: absolute; bottom: 10px; width: 120px; height: 120px; transition: left 0.1s linear; }
    #monster { left: 0%; z-index: 2; }
    #player { left: 25%; z-index: 3; }
    
    /* 🌟 역동적인 달리기 애니메이션 복구 */
    @keyframes runAnim {
        0% { transform: translateY(0) rotate(0deg); }
        25% { transform: translateY(-8px) rotate(-5deg); }
        50% { transform: translateY(0) rotate(0deg); }
        75% { transform: translateY(-8px) rotate(5deg); }
        100% { transform: translateY(0) rotate(0deg); }
    }
    .character img { 
        width: 100%; 
        height: 100%; 
        object-fit: contain; 
        animation: runAnim 0.6s infinite; /* 폴짝폴짝 뛰는 효과 */
    }
    
    .question-box { background: #f5f6fa; color: #2f3640; padding: 20px; border-radius: 10px; font-size: 28px; font-weight: bold; margin-bottom: 20px; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .option-btn { padding: 20px; font-size: 24px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .option-btn:hover { background: #2980b9; }
    
    .hidden { display: none !important; }
</style>

<script>
        const pwd = prompt("특수각 탈출 게임입니다. 비밀번호를 입력하세요 🔒");
        if (pwd !== "1771") {
            alert("비밀번호가 틀렸습니다! ❌");
            location.href = "index.html"; 
        }
    </script>
</head>
<body>
    <div class="container">
        <!-- 🌟 눈에 확 띄는 노란색 뒤로가기 버튼 유지 -->
        <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
            <a href="trig.html" style="color: #2f3640; text-decoration: none; background: #fbc531; padding: 10px 20px; border-radius: 8px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">⬅ 메뉴로</a>
        </div>
        
        <h1>🏃 특수각 괴물 추격전 👾</h1>
        
        <div id="start-screen">
            <p style="font-size: 20px; margin-bottom: 30px;">특수각(30°, 45°, 60°) 문제를 풀고 괴물로부터 도망치세요!</p>
            <button class="btn btn-easy" onclick="startGame(4)">🟢 쉬움</button>
            <button class="btn btn-normal" onclick="startGame(7)">🟡 보통</button>
            <button class="btn btn-hard" onclick="startGame(10)">🔴 어려움</button>
        </div>

        <div id="main-game" class="hidden">
            <h2 id="status-text" style="color: #e1b12c;">캐릭터 불러오는 중...</h2>
            
            <!-- 🌟 절대 사라지지 않는 확실한 시작 버튼! -->
            <button id="action-btn" class="btn btn-hard hidden" onclick="startChase()" style="width: 100%; font-size: 24px; padding: 20px; background: #e74c3c;">🚨 추격 시작! (클릭 시 괴물 출발)</button>

            <!-- 🌟 이모지 대신 선생님의 이미지 태그 복구 -->
            <div id="track">
                <div class="safe-zone"></div>
                <div id="monster" class="character"><img id="monster-img" src="monster_running.png" alt="괴물"></div>
                <div id="player" class="character"><img id="player-img" src="cat_running.png" alt="고양이"></div>
            </div>

            <div id="game-ui" class="hidden">
                <div class="question-box" id="question-text">문제 준비 중...</div>
                <div class="options-grid" id="options-area"></div>
            </div>
        </div>

        <div id="result-screen" class="hidden" style="margin-top: 30px;">
            <h2 id="result-msg" style="font-size: 36px;"></h2>
            <button class="btn btn-easy" onclick="location.reload()" style="font-size: 24px; padding: 15px 40px;">다시 도전하기 🔄</button>
        </div>
    </div>

<script>
// 🌟 선생님의 원래 이미지 배경 투명화 로직 완벽 복구
const processedImages = {};
let isImagesReady = false;

function removeBackground(imageSrc, callback) {
    const img = new Image();
    img.crossOrigin = "Anonymous";
    img.onload = function() {
        const canvas = document.createElement("canvas");
        canvas.width = img.width; canvas.height = img.height;
        const ctx = canvas.getContext("2d"); ctx.drawImage(img, 0, 0);
        try {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            // 🌟 이미지의 맨 왼쪽 위(배경) 색상을 스스로 스캔합니다.
            const bgR = data[0], bgG = data[1], bgB = data[2];
            
            for (let i = 0; i < data.length; i += 4) {
                // 🌟 스캔한 배경색(검은색)과 비슷한 색상만 골라서 투명하게 지웁니다!
                // 오차 범위(40)를 좁혀서 남색 괴물은 절대 지워지지 않게 방어!
                if (Math.abs(data[i] - bgR) < 40 && 
                    Math.abs(data[i+1] - bgG) < 40 && 
                    Math.abs(data[i+2] - bgB) < 40) {
                    data[i+3] = 0; // 투명하게 만들기
                }
            }
            ctx.putImageData(imageData, 0, 0); callback(canvas.toDataURL());
        } catch (e) { callback(imageSrc); } 
    };
    img.onerror = () => callback(imageSrc); 
    img.src = imageSrc;
}

// 화면 열리자마자 미리 이미지 로딩 시작
window.onload = () => {
    const imagesToProcess = ["cat_running.png", "cat_scared.png", "cat_caught.png", "cat_happy.png", "monster_running.png", "monster_evil.png"];
    let loadedCount = 0;
    imagesToProcess.forEach(src => {
        removeBackground(src, (dataUrl) => {
            processedImages[src] = dataUrl; 
            loadedCount++;
            if (loadedCount === imagesToProcess.length) { 
                isImagesReady = true; 
                // 난이도 선택해서 메인 화면 들어와 있다면 버튼 활성화
                if(!document.getElementById("main-game").classList.contains("hidden")) {
                    showReadyState();
                }
            }
        });
    });
};

function getImg(src) { return processedImages[src] || src; }

const allQuestions = [
    { q: "sin 30°", a: "1/2", options: ["1/2", "√2/2", "√3/2", "1"] },
    { q: "cos 30°", a: "√3/2", options: ["1/2", "√2/2", "√3/2", "1"] },
    { q: "tan 30°", a: "√3/3", options: ["√3/3", "1", "√3", "0"] },
    { q: "sin 45°", a: "√2/2", options: ["1/2", "√2/2", "√3/2", "1"] },
    { q: "cos 45°", a: "√2/2", options: ["1/2", "√2/2", "√3/2", "1"] },
    { q: "tan 45°", a: "1", options: ["√3/3", "1", "√3", "0"] },
    { q: "sin 60°", a: "√3/2", options: ["1/2", "√2/2", "√3/2", "1"] },
    { q: "cos 60°", a: "1/2", options: ["1/2", "√2/2", "√3/2", "1"] },
    { q: "tan 60°", a: "√3", options: ["√3/3", "1", "√3", "0"] }
];

let monsterSpeed = 5;
let playerPos = 25;
let targetPlayerPos = 25;
let monsterPos = 0;
const safeZone = 85;
let currentStep = 0;
const totalSteps = 6;
let gameQuestions = [];
let isGameOver = false;
let animationId = null;
let lastTime = 0;

function startGame(speed) {
    monsterSpeed = speed;
    document.getElementById("start-screen").classList.add("hidden");
    document.getElementById("main-game").classList.remove("hidden");
    
    playerPos = 25; targetPlayerPos = 25; monsterPos = 0;
    currentStep = 0; isGameOver = false;
    
    document.getElementById("player").style.left = playerPos + "%";
    document.getElementById("monster").style.left = monsterPos + "%";
    gameQuestions = [...allQuestions].sort(() => Math.random() - 0.5).slice(0, totalSteps);
    
    if (isImagesReady) {
        showReadyState();
    } else {
        document.getElementById("status-text").innerText = "캐릭터 불러오는 중... 조금만 기다려주세요!";
    }
}

function showReadyState() {
    document.getElementById("player-img").src = getImg("cat_running.png");
    document.getElementById("monster-img").src = getImg("monster_running.png");
    
    document.getElementById("status-text").innerText = "준비 완료! 아래 버튼을 누르면 추격이 시작됩니다!";
    document.getElementById("action-btn").classList.remove("hidden");
}

function startChase() {
    document.getElementById("action-btn").classList.add("hidden");
    document.getElementById("game-ui").classList.remove("hidden");
    document.getElementById("status-text").innerText = "🏃💨 빨리 정답을 고르세요!";
    
    loadQuestion();
    lastTime = performance.now();
    animationId = requestAnimationFrame(gameLoop);
}

function gameLoop(time) {
    if (isGameOver) return;
    
    const deltaTime = time - lastTime; 
    lastTime = time;
    
    monsterPos += (monsterSpeed * deltaTime) / 1000;
    
    if (playerPos < targetPlayerPos) {
        playerPos += (20 * deltaTime) / 1000;
        if (playerPos > targetPlayerPos) playerPos = targetPlayerPos;
    }
    
    document.getElementById("monster").style.left = monsterPos + "%";
    document.getElementById("player").style.left = playerPos + "%";
    
    // 🌟 거리에 따른 선생님 캐릭터 표정 변화 복구
    const distance = playerPos - monsterPos;
    let catImg = "cat_running.png"; 
    let monsterImg = "monster_running.png";
    
    if (distance <= 15 && distance > 0) {
        catImg = "cat_scared.png";
        monsterImg = "monster_evil.png";
    }
    
    document.getElementById("player-img").src = getImg(catImg);
    document.getElementById("monster-img").src = getImg(monsterImg);
    
    if (monsterPos >= playerPos - 5) {
        endGame(false, "🩸 괴물에게 따라잡혔습니다...");
        return;
    }
    if (playerPos >= safeZone) {
        endGame(true, "🎉 무사히 탈출했습니다!");
        return;
    }
    
    animationId = requestAnimationFrame(gameLoop);
}

function loadQuestion() {
    if (currentStep >= totalSteps) return;
    
    const qData = gameQuestions[currentStep];
    document.getElementById("question-text").innerText = qData.q;
    
    const optionsArea = document.getElementById("options-area");
    optionsArea.innerHTML = "";
    
    const shuffledOptions = [...qData.options].sort(() => Math.random() - 0.5);
    shuffledOptions.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt, qData.a);
        optionsArea.appendChild(btn);
    });
}

function checkAnswer(selected, correct) {
    if (isGameOver) return;
    
    if (selected === correct) {
        currentStep++;
        targetPlayerPos = 25 + (currentStep / totalSteps) * (safeZone - 25);
        
        if (currentStep < totalSteps) {
            loadQuestion();
        } else {
            document.getElementById("game-ui").classList.add("hidden");
            document.getElementById("status-text").innerText = "안전지대로 전력 질주 중!! 🏃💨";
        }
    } else {
        endGame(false, "❌ 오답! 괴물에게 덜미를 잡혔습니다!");
    }
}

function endGame(isWin, msg) {
    isGameOver = true;
    cancelAnimationFrame(animationId);
    
    document.getElementById("game-ui").classList.add("hidden");
    document.getElementById("result-screen").classList.remove("hidden");
    
    const resultMsg = document.getElementById("result-msg");
    if (isWin) {
        resultMsg.innerText = msg;
        resultMsg.style.color = "#2ecc71";
        document.getElementById("player-img").src = getImg("cat_happy.png");
        document.getElementById("status-text").innerText = "미션 성공!";
    } else {
        document.getElementById("monster").style.left = document.getElementById("player").style.left;
        document.getElementById("player-img").src = getImg("cat_caught.png");
        document.getElementById("monster-img").src = getImg("monster_evil.png");
        resultMsg.innerText = msg;
        resultMsg.style.color = "#e74c3c";
        document.getElementById("status-text").innerText = "게임 오버!";
    }
}
</script>
</body>
</html>
